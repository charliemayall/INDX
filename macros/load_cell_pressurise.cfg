[load_cell_pressurise]
# Use load_cell_probe when the printer has [load_cell_probe] only (typical).
sensor: load_cell_probe
max_length: 8.0
dwell_after_pressure: 0.0
onset_dwell: 0.10
ready_delta_g: 90
sigma_mult: 5
rolling_window: 0.05
grace: 0.05
baseline_time: 0.25
abort_force_g: 1800.0
speed:1

[gcode_macro LC_PRIME_AT]
description: Move to the prime pad, tare on contact, closed-loop pressurise
variable_prime_x: 192.0
variable_prime_y: -2.0
# Anti-ooze retract (mm). Hidden from gcode E so the next print extrusion unretracts it.
variable_retract: 0.2
variable_retract_speed: 30.0
gcode:
    {% set lift = params.LIFT|default(2.0)|float %}
    {% set speed = params.SPEED|default(0.5)|float %}
    {% set max_length = params.MAX_LENGTH|default(8)|float %}
    {% set dwell = params.DWELL|default(0.0)|float %}
    {% set settle_ms = (params.SETTLE|default(0.5)|float * 1000)|int %}
    {% set retract = params.RETRACT|default(printer["gcode_macro LC_PRIME_AT"].retract)|float %}
    {% set retract_speed = params.RETRACT_SPEED|default(printer["gcode_macro LC_PRIME_AT"].retract_speed)|float %}
    {% set has_temp = 'TEMP' in params %}
    {% if has_temp %}
        {% set temp = params.TEMP|float %}
    {% endif %}

    {% if 'SKIP' in params %}
        RESPOND MSG="LC_PRIME_AT: skipped (SKIP)"
    {% elif 'Z' not in params %}
        RESPOND TYPE=error MSG="LC_PRIME_AT: Z is required - no-op"
    {% elif "xyz" not in printer.toolhead.homed_axes %}
        RESPOND TYPE=error MSG="LC_PRIME_AT: axes not homed - no-op"
    {% else %}
        {% set x = printer["gcode_macro LC_PRIME_AT"].prime_x|float %}
        {% set y = printer["gcode_macro LC_PRIME_AT"].prime_y|float %}
        {% set z = params.Z|float %}
        {% set th = printer.toolhead %}
        {% set xmin = th.axis_minimum.x|float %}
        {% set xmax = th.axis_maximum.x|float %}
        {% set ymin = th.axis_minimum.y|float %}
        {% set ymax = th.axis_maximum.y|float %}
        {% set zmin = th.axis_minimum.z|float %}
        {% set zmax = th.axis_maximum.z|float %}

        {% if x < xmin or x > xmax or y < ymin or y > ymax or z < zmin or z > zmax %}
            RESPOND TYPE=error MSG="LC_PRIME_AT: target out of axis limits (X=%.3f Y=%.3f Z=%.3f) - no-op"|format(x, y, z)
        {% else %}
            {% set use_indx = 'gcode_macro TOOL_POSITIONS' in printer %}
            {% if use_indx %}
                {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
                {% set clear_y = tp.clearance_y|float %}
                {% set z_clr = tp.probe_z_clearance|float %}
            {% else %}
                {% set clear_y = 0.0 %}
                {% set z_clr = 10.0 %}
            {% endif %}
            # Travel Z: never skim the bed; prefer INDX probe_z_clearance
            {% set cur_z = th.position.z|float %}
            {% set travel_z = [cur_z, z + lift, z_clr]|max %}
            {% if travel_z > zmax %}{% set travel_z = zmax %}{% endif %}
            {% if travel_z < z %}{% set travel_z = z %}{% endif %}

            SAVE_GCODE_STATE NAME=LC_PRIME_AT
            G90
            G1 Z{"%.3f"|format(travel_z)} F6000
            {% if use_indx %}
                # Dock-safe approach: clearance_y -> prime_x -> prime_y
                G1 Y{"%.3f"|format(clear_y)} F6000
                G1 X{"%.3f"|format(x)} F18000
                G1 Y{"%.3f"|format(y)} F6000
            {% else %}
                G1 X{"%.3f"|format(x)} Y{"%.3f"|format(y)} F18000
            {% endif %}
            G1 Z{"%.3f"|format(z)} F1200
            M400
            {% if has_temp %}
                TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - 3} MAXIMUM={temp + 3}
            {% endif %}
            G4 P500
            LOAD_CELL_TARE
            M400
            G4 P{settle_ms}
            LC_PRESSURISE SPEED={speed} MAX_LENGTH={max_length} DWELL_AFTER_PRESSURE={dwell}
            M400
            {% if use_indx %}
                # Leave dock zone before restoring state
                # G1 Z{"%.3f"|format(travel_z)} F6000
                G1 Y{"%.3f"|format(clear_y)} F6000
            {% endif %}
            RESTORE_GCODE_STATE NAME=LC_PRIME_AT MOVE=0
            # Absorb primed E into kinematics so restore does not retract
            {% set e0 = printer.gcode_move.gcode_position.e|float %}
            SET_KINEMATIC_POSITION E={e0}
            {% if retract > 0.0 %}
                # Physical anti-ooze retract, then hide it from gcode E.
                # First print extrusion unretracts automatically over the first retract mm.
                G91
                G1 E{"-%.4f"|format(retract)} F{"%d"|format((retract_speed * 60)|int)}
                G90
                SET_KINEMATIC_POSITION E={e0}
                G92 E{e0}
            {% endif %}
        {% endif %}
    {% endif %}