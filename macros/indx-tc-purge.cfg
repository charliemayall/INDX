#####################################################################
#  INDX post-toolchange purge station (Prusa CORE One INDX port)
#####################################################################
#
#  Successor path for post-TC purge / prime / wipe. Greenfield macros -
#  not based on, compatible with, or aware of INDX_PURGE_PELLET or LC_*.
#
#  Dock park/pick stays in CHANGE_TOOL / PARK_TOOL / _PICKUP_TOOL.
#  This module runs AFTER a successful pick.
#
#  Include from printer.cfg (after indx-tc-macros.cfg):
#    [include indx-tc-purge.cfg]
#
#  Step-by-step geometry / limit calibration:
#    macros/INDX_TC_PURGE_SETUP.md
#
#  Orca tool change G-code (early heat on T; staged waits in POST):
#    T{next_extruder} TEMP={temperature[next_extruder]}
#    M400
#    INDX_TC_POST TEMP={temperature[next_extruder]}
#
#  Latch note: pickup already advances ~full_lock_e (+11 mm) cold via
#  INDX_EXTRUDER_MOVE. Deretract recovers the intentional long TC retract
#  budget (retract_toolchange), not the full latch lock. Tip retracts must
#  stay well under latch unlock (~11 mm); default post_purge_retract 0.8.
#
#  Manual checks:
#    1. INDX_TC_RETRACT STATE=query
#    2. INDX_TC_PURGE_TEST TEMP=220
#    3. Two-colour slice with toolchange G-code above - no double heat-wait;
#       first extrusion after TC unretracts cleanly (unretract_after_exit=0
#       by default - tip stays in during travel; unretract on the bed /
#       first print move. Set 1 only if the slicer will not unretract)
#    4. Confirm tip retract << latch unlock (~11 mm)
#    5. Dry: INDX_TC_POST TEMP=220 SKIP_PURGE after a CHANGE_TOOL
#    6. E-hide: after POST, gcode E should match pre-POST; physical tip
#       primed if unretract_after_exit is on
#
#  Tune geometry with SET_GCODE_VARIABLE (not persisted across restart
#  unless you edit this file):
#    SET_GCODE_VARIABLE MACRO=INDX_TC_VARS VARIABLE=station_x VALUE=192.0
#
#  XY envelopes (commanded destinations). clear_y =
#  TOOL_POSITIONS.clearance_y if present, else INDX_TC_VARS.clearance_y.
#  dock_dir = TOOL_POSITIONS.dock_dir if present, else -1.
#  Paths also sweep from the head's current XY into the first waypoint.
#
#  INDX_TC_VARS / INDX_TC_RETRACT
#    No XY motion (vars only / E-only).
#
#  _INDX_TC_GOTO_STATION
#    Via brush then station (clear_y first for dock/print clearance):
#    Order: Y->clear_y, XY->brush_x/brush_y, XY->station_x/station_y
#    X envelope: min/max(brush_x, station_x) plus path from entry X
#    Y envelope: min/max(clear_y, brush_y, station_y)
#
#  _INDX_TC_EJECT  (same stroke axis as wipe_along_x)
#    wipe_along_x=0:
#      X: none  Y: min/max(station_y, station_y + dock_dir*eject_jiggle_dist)
#    wipe_along_x=1:
#      Y: none  X: min/max(station_x, station_x + eject_jiggle_dir*eject_jiggle_dist)
#
#  _INDX_TC_FLUSH  (wipe_along_x 0 = Prusa Y wiggle; 1 = X wiggle)
#    wipe_along_x=0:
#      X: none (station_x)  Y: station_y - flush_d_neg .. station_y + flush_d_pos
#    wipe_along_x=1:
#      Y: none (station_y)  X: station_x - flush_d_neg .. station_x + flush_d_pos
#
#  _INDX_TC_BRUSH  (world spans stay brush_*_span; stroke axis swaps)
#    Let half_pass = (brush_passes - 1) / (2 * brush_passes) * pass_span
#      (0 when brush_passes == 1; pass_span = brush_x_span if wipe_along_x=0
#       else brush_y_span)
#    wipe_along_x=0 (stroke Y, pass offsets X):
#      X: brush_x - half_pass .. brush_x + half_pass
#      Y: brush_y - brush_y_span .. brush_y + brush_y_span
#    wipe_along_x=1 (stroke X, pass offsets Y):
#      X: brush_x - brush_x_span .. brush_x + brush_x_span
#      Y: brush_y - half_pass .. brush_y + half_pass
#
#  _INDX_TC_EXIT_STATION
#    X: none
#    Y: clear_y
#
#  _INDX_TC_POST_FINISH
#    XY: same as _INDX_TC_EXIT_STATION (then Z only / E unretract)
#
#  INDX_TC_POST  (SKIP_PURGE: no XY)
#    Union of GOTO + EJECT + FLUSH + BRUSH + EXIT (use the wipe_along_x
#    branch formulas above for flush/brush terms).
#
#  INDX_TC_PURGE_TEST / _NEXT / _LINE
#    Bed lines (plus full INDX_TC_POST envelope on T1..Tn; CHANGE_TOOL
#    dock motion is outside this file):
#      cx = (axis_minimum.x + axis_maximum.x) / 2
#      cy = (axis_minimum.y + axis_maximum.y) / 2
#      max_tool = min(TOOLS default 4, tool_count - 1)
#      x0 = cx - max_tool * LINE_GAP / 2
#    Line X: x0 .. x0 + max_tool * LINE_GAP
#            (= cx - max_tool*LINE_GAP/2 .. cx + max_tool*LINE_GAP/2)
#    Line Y: cy - LINE_LEN/2 .. cy + LINE_LEN/2
#    Overall test XY = union(line box, INDX_TC_POST box, dock TC path)
#
#####################################################################

[gcode_macro INDX_TC_VARS]
description: Purge-station geometry and Prusa-style TC budgets (tunable)
# --- Station (station_z is a minimum clearance - never lower Z to it) ---
variable_station_x: 190.0
variable_station_y: -11.0
variable_station_z: 5.0
# Fallback if TOOL_POSITIONS.clearance_y is unavailable
variable_clearance_y: 0.0
variable_enter_feed: 200
variable_exit_feed: 200
# --- Eject / brush ---
variable_eject_jiggle_count: 3
variable_eject_jiggle_dist: 9
variable_eject_jiggle_feed: 120
# Sign along stroke when wipe_along_x=1 (+1 or -1). Y-wipe still uses dock_dir.
variable_eject_jiggle_dir: 1
variable_brush_x: 181.0
variable_brush_y: -10.0
variable_brush_y_span: 3.0
variable_brush_x_span: 6.0
variable_brush_passes: 3
variable_brush_feed: 200
# 0 = stroke along Y, pass offsets along X (Prusa). 1 = stroke along X,
# pass offsets along Y (wiper runs along X). Applies to eject + flush + brush.
variable_wipe_along_x: 1
# --- Flush wiggle (mm along stroke axis from station centre) ---
variable_flush_d_neg: 1.5
variable_flush_d_pos: 1.3
# --- Heat staging (Prusa) ---
variable_eject_temp_floor: 175.0
variable_eject_temp_delta: 40.0
variable_near_full_delta: 5.0
# --- Purge volume ---
# Later toolchanges (tool already used this print): volume in mm³
variable_purge_volume_mm3: 12.0
# First INDX_TC_POST for each tool this print: filament length (mm)
variable_first_use_purge_mm: 25.0
variable_filament_diameter: 1.75
variable_purge_speed_fast: 10.0
variable_purge_speed_slow: 5.0
variable_purge_speed_min: 2.0
# --- Retract budgets (Prusa) ---
variable_retract_toolchange: 8.0
variable_retract_length: 0.8
variable_lock_finish_e: 1.6
variable_post_purge_retract: 0.8
variable_retract_feed: 40.0
variable_deretract_feed: 20.0
variable_lock_feed: 20.0
variable_do_lock_finish: 1
# Leave tip retracted after station exit so travel to the print does not
# ooze. PURGE_TEST unretracts on the bed; for prints either leave this 0
# and unretract on first extrusion, or set 1 if the slicer will not.
variable_unretract_after_exit: 0
# --- Speeds ---
variable_travel_speed: 250
variable_flush_fan: 100
# --- Resume (LAYER_Z / resume_z are raise-only minimums; never lower Z) ---
variable_resume_z_extra: 1.0
# --- Runtime (do not hand-edit mid-print) ---
# Bit N set => tool N has completed at least one INDX_TC_POST this print
# (clear with INDX_TC_RESET at PRINT_START)
variable_tool_init: 0
variable_last_tip_retract: 0.0
variable_saved_pa: 0.0
variable_saved_fan: 0
variable_resume_z: 5.0
gcode:
    {action_respond_info("INDX_TC_VARS: use SET_GCODE_VARIABLE to tune; see file header")}

#####################################################################
#  INDX_TC_RETRACT - single entry for TC filament E state
#####################################################################

[gcode_macro INDX_TC_RETRACT]
description: Toolchange retract/deretract bookkeeping. STATE=pre_park|long|lock_finish|deretract|post_purge|query
gcode:
    {% if 'STATE' not in params %}
        {action_raise_error("INDX_TC_RETRACT requires STATE=<pre_park|long|lock_finish|deretract|post_purge|query>")}
    {% endif %}
    {% set state = params.STATE|string|lower %}
    {% set v = printer["gcode_macro INDX_TC_VARS"] %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% set tool = params.TOOL|default(act)|int %}

    {% if state == "query" %}
        {action_respond_info("INDX_TC_RETRACT: tool_init=0x%x last_tip_retract=%.3f active_tool=%d"
            % (v.tool_init|int, v.last_tip_retract|float, act))}
    {% elif state == "pre_park" %}
        {% set length = params.LENGTH|default(v.retract_length)|float %}
        {% set feed = params.FEED|default(v.retract_feed)|float %}
        {% if length > 0.0 %}
            G91
            G1 E{"-%.4f"|format(length)} F{"%d"|format((feed * 60)|int)}
            G90
        {% endif %}
    {% elif state == "long" %}
        {% set length = params.LENGTH|default(v.retract_toolchange)|float %}
        {% set feed = params.FEED|default(v.retract_feed)|float %}
        {% if length > 0.0 %}
            G91
            G1 E{"-%.4f"|format(length)} F{"%d"|format((feed * 60)|int)}
            G90
        {% endif %}
    {% elif state == "lock_finish" %}
        # Hot finish-lock after eject gate. Physical E; hide from gcode E.
        {% set length = params.LENGTH|default(v.lock_finish_e)|float %}
        {% set feed = params.FEED|default(v.lock_feed)|float %}
        {% set e0 = printer.gcode_move.gcode_position.e|float %}
        {% if length > 0.0 %}
            G91
            G1 E{"%.4f"|format(length)} F{"%d"|format((feed * 60)|int)}
            G90
            SET_KINEMATIC_POSITION E={"%.4f"|format(e0)}
            G92 E{"%.4f"|format(e0)}
        {% endif %}
    {% elif state == "deretract" %}
        {% set base = v.retract_toolchange|float %}
        {% set tip = v.retract_length|float %}
        {% set init = v.tool_init|int %}
        {% if tool >= 0 and tool < 16 %}
            {% set bit = (2 ** tool)|int %}
            {% set inited = (init // bit) % 2 %}
        {% else %}
            {% set inited = 0 %}
        {% endif %}
        {% if inited != 0 %}
            {% set length = params.LENGTH|default(base + tip)|float %}
        {% else %}
            {% set length = params.LENGTH|default(base)|float %}
        {% endif %}
        {% set feed = params.FEED|default(v.deretract_feed)|float %}
        {% if length > 0.0 %}
            G91
            G1 E{"%.4f"|format(length)} F{"%d"|format((feed * 60)|int)}
            G90
        {% endif %}
    {% elif state == "post_purge" %}
        {% set length = params.LENGTH|default(v.post_purge_retract)|float %}
        {% set feed = params.FEED|default(v.retract_feed)|float %}
        {% set e0 = printer.gcode_move.gcode_position.e|float %}
        {% if length > 0.0 %}
            G91
            G1 E{"-%.4f"|format(length)} F{"%d"|format((feed * 60)|int)}
            G90
            SET_KINEMATIC_POSITION E={"%.4f"|format(e0)}
            G92 E{"%.4f"|format(e0)}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=INDX_TC_VARS VARIABLE=last_tip_retract VALUE={length}
        {% if tool >= 0 and tool < 16 %}
            {% set bit = (2 ** tool)|int %}
            {% set cur = v.tool_init|int %}
            {% set already = (cur // bit) % 2 %}
            {% if already == 0 %}
                SET_GCODE_VARIABLE MACRO=INDX_TC_VARS VARIABLE=tool_init VALUE={cur + bit}
            {% endif %}
        {% endif %}
    {% else %}
        {action_raise_error("INDX_TC_RETRACT: unknown STATE=%s" % state)}
    {% endif %}

#####################################################################
#  Travel helpers (inner)
#####################################################################

[gcode_macro _INDX_TC_GOTO_STATION]
description: Inner - travel to purge station via brush XY
gcode:
    {% set v = printer["gcode_macro INDX_TC_VARS"] %}
    {% set f_travel = (v.enter_feed|float * 60)|int %}
    {% set bx = v.brush_x|float %}
    {% set by = v.brush_y|float %}
    {% set sx = v.station_x|float %}
    {% set sy = v.station_y|float %}
    {% set sz = v.station_z|float %}
    {% if 'gcode_macro TOOL_POSITIONS' in printer %}
        {% set clear_y = printer["gcode_macro TOOL_POSITIONS"].clearance_y|float %}
    {% else %}
        {% set clear_y = v.clearance_y|float %}
    {% endif %}
    G90
    # station_z is a minimum: raise only if below; never dive from print Z
    {% set cur_z = printer.toolhead.position.z|float %}
    {% if cur_z < sz %}
        G1 Z{"%.3f"|format(sz)} F{"%d"|format(f_travel)}
    {% endif %}
    G1 Y{"%.3f"|format(clear_y)} F{"%d"|format(f_travel)}
    G1 X{"%.3f"|format(bx)} Y{"%.3f"|format(by)} F{"%d"|format(f_travel)}
    G1 X{"%.3f"|format(sx)} Y{"%.3f"|format(sy)} F{"%d"|format(f_travel)}

[gcode_macro _INDX_TC_EJECT]
description: Inner - jiggle at station along wipe stroke axis to drop purge blob
gcode:
    {% set v = printer["gcode_macro INDX_TC_VARS"] %}
    {% set sx = v.station_x|float %}
    {% set sy = v.station_y|float %}
    {% set dist = v.eject_jiggle_dist|float %}
    {% set count = v.eject_jiggle_count|int %}
    {% set f_j = (v.eject_jiggle_feed|float * 60)|int %}
    {% set along_x = v.wipe_along_x|int %}
    G90
    {% if along_x %}
        {% set sign = v.eject_jiggle_dir|int %}
        {% if sign != 1 and sign != -1 %}
            {% set sign = -1 %}
        {% endif %}
        {% set jiggle_x = sx + sign * dist %}
        {% for _ in range(count) %}
            G1 X{"%.3f"|format(jiggle_x)} F{"%d"|format(f_j)}
            G1 X{"%.3f"|format(sx)} F{"%d"|format(f_j)}
        {% endfor %}
    {% else %}
        {% if 'gcode_macro TOOL_POSITIONS' in printer %}
            {% set dock_dir = printer["gcode_macro TOOL_POSITIONS"].dock_dir|int %}
        {% else %}
            {% set dock_dir = -1 %}
        {% endif %}
        {% set jiggle_y = sy + dock_dir * dist %}
        {% for _ in range(count) %}
            G1 Y{"%.3f"|format(jiggle_y)} F{"%d"|format(f_j)}
            G1 Y{"%.3f"|format(sy)} F{"%d"|format(f_j)}
        {% endfor %}
    {% endif %}

[gcode_macro _INDX_TC_FLUSH]
description: Inner - Prusa flush fractions with wiggle along stroke axis
gcode:
    {% set v = printer["gcode_macro INDX_TC_VARS"] %}
    {% set dia = v.filament_diameter|float %}
    {% set area = 3.141592653589793 * dia * dia / 4.0 %}
    {% if 'PURGE_MM' in params %}
        {% set purge_mm = params.PURGE_MM|float %}
    {% else %}
        {% set purge_mm3 = params.PURGE_MM3|default(v.purge_volume_mm3)|float %}
        {% set purge_mm = purge_mm3 / area %}
    {% endif %}
    {% set sx = v.station_x|float %}
    {% set sy = v.station_y|float %}
    {% set d_neg = v.flush_d_neg|float %}
    {% set d_pos = v.flush_d_pos|float %}
    {% set along_x = v.wipe_along_x|int %}
    {% set spd_slow = v.purge_speed_slow|float %}
    {% set spd_fast = v.purge_speed_fast|float %}
    {% set spd_min = v.purge_speed_min|float %}
    {% if spd_slow < spd_min %}{% set spd_slow = spd_min %}{% endif %}
    {% if spd_fast < spd_min %}{% set spd_fast = spd_min %}{% endif %}
    {% set f_slow = (spd_slow * 60)|int %}
    {% set f_fast = (spd_fast * 60)|int %}
    {% set f_crawl = 60 %}
    G90
    M83
    {% if along_x %}
        G1 X{"%.3f"|format(sx)} F{"%d"|format(f_slow)}
        G1 E{"%.4f"|format(0.4 * purge_mm)} F{"%d"|format(f_slow)}
        G1 X{"%.3f"|format(sx + d_pos)} E{"%.4f"|format(0.3 * purge_mm)} F{"%d"|format(f_fast)}
        G1 X{"%.3f"|format(sx)} E{"%.4f"|format(0.05 * purge_mm)} F{"%d"|format(f_crawl)}
        G1 X{"%.3f"|format(sx - d_neg)} E{"%.4f"|format(0.25 * purge_mm)} F{"%d"|format(f_fast)}
        G1 X{"%.3f"|format(sx)} F{"%d"|format(f_slow)}
    {% else %}
        G1 Y{"%.3f"|format(sy)} F{"%d"|format(f_slow)}
        G1 E{"%.4f"|format(0.4 * purge_mm)} F{"%d"|format(f_slow)}
        G1 Y{"%.3f"|format(sy + d_pos)} E{"%.4f"|format(0.3 * purge_mm)} F{"%d"|format(f_fast)}
        G1 Y{"%.3f"|format(sy)} E{"%.4f"|format(0.05 * purge_mm)} F{"%d"|format(f_crawl)}
        G1 Y{"%.3f"|format(sy - d_neg)} E{"%.4f"|format(0.25 * purge_mm)} F{"%d"|format(f_fast)}
        G1 Y{"%.3f"|format(sy)} F{"%d"|format(f_slow)}
    {% endif %}

[gcode_macro _INDX_TC_BRUSH]
description: Inner - wipe nozzle on brush after flush
gcode:
    {% set v = printer["gcode_macro INDX_TC_VARS"] %}
    {% set bx = v.brush_x|float %}
    {% set by = v.brush_y|float %}
    {% set span_x = v.brush_x_span|float %}
    {% set span_y = v.brush_y_span|float %}
    {% set passes = v.brush_passes|int %}
    {% if passes < 1 %}{% set passes = 1 %}{% endif %}
    {% set f_b = (v.brush_feed|float * 60)|int %}
    {% set f_t = (v.travel_speed|float * 60)|int %}
    {% set along_x = v.wipe_along_x|int %}
    G90
    {% if along_x %}
        {% set x_lo = bx - span_x %}
        {% set x_hi = bx + span_x %}
        {% set pass_span = span_y %}
        G1 X{"%.3f"|format(x_lo)} Y{"%.3f"|format(by)} F{"%d"|format(f_t)}
        {% for i in range(passes) %}
            {% set oy = (i - (passes - 1) / 2.0) * (pass_span / passes) %}
            G1 X{"%.3f"|format(x_lo)} Y{"%.3f"|format(by + oy)} F{"%d"|format(f_b)}
            G1 X{"%.3f"|format(x_hi)} F{"%d"|format(f_b)}
            G1 X{"%.3f"|format(x_lo)} F{"%d"|format(f_b)}
        {% endfor %}
    {% else %}
        {% set y_lo = by - span_y %}
        {% set y_hi = by + span_y %}
        {% set pass_span = span_x %}
        G1 X{"%.3f"|format(bx)} Y{"%.3f"|format(y_lo)} F{"%d"|format(f_t)}
        {% for i in range(passes) %}
            {% set ox = (i - (passes - 1) / 2.0) * (pass_span / passes) %}
            G1 X{"%.3f"|format(bx + ox)} Y{"%.3f"|format(y_lo)} F{"%d"|format(f_b)}
            G1 Y{"%.3f"|format(y_hi)} F{"%d"|format(f_b)}
            G1 Y{"%.3f"|format(y_lo)} F{"%d"|format(f_b)}
        {% endfor %}
    {% endif %}

[gcode_macro _INDX_TC_EXIT_STATION]
description: Inner - leave station to clearance Y
gcode:
    {% set v = printer["gcode_macro INDX_TC_VARS"] %}
    {% set f_travel = (v.exit_feed|float * 60)|int %}
    {% if 'gcode_macro TOOL_POSITIONS' in printer %}
        {% set clear_y = printer["gcode_macro TOOL_POSITIONS"].clearance_y|float %}
    {% else %}
        {% set clear_y = v.clearance_y|float %}
    {% endif %}
    G90
    G1 Y{"%.3f"|format(clear_y)} F{"%d"|format(f_travel)}

#####################################################################
#  INDX_TC_POST - main post-TC purge-station sequence
#####################################################################

[gcode_macro INDX_TC_RESET]
description: Clear per-print tool_init flags (call from PRINT_START)
gcode:
    SET_GCODE_VARIABLE MACRO=INDX_TC_VARS VARIABLE=tool_init VALUE=0
    SET_GCODE_VARIABLE MACRO=INDX_TC_VARS VARIABLE=last_tip_retract VALUE=0
    {action_respond_info("INDX_TC_RESET: tool_init cleared for new print")}

[gcode_macro INDX_TC_POST]
description: After CHANGE_TOOL - staged heat, purge station flush, brush, tip retract. TEMP= required.
gcode:
    {% if 'TEMP' not in params %}
        {action_raise_error("INDX_TC_POST requires TEMP=<celsius>")}
    {% elif "xyz" not in printer.toolhead.homed_axes %}
        {action_raise_error("INDX_TC_POST: axes not homed")}
    {% else %}
        {% set v = printer["gcode_macro INDX_TC_VARS"] %}
        {% set temp = params.TEMP|float %}
        {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
        {% set tool = params.TOOL|default(act)|int %}
        {% set skip_purge = 1 if 'SKIP_PURGE' in params else 0 %}
        {% set eject_temp = [v.eject_temp_floor|float, temp - v.eject_temp_delta|float]|max %}
        {% set near_temp = temp - v.near_full_delta|float %}
        {% set e0 = printer.gcode_move.gcode_position.e|float %}
        {% set prev_pa = printer.extruder.pressure_advance|default(0.0)|float %}
        {% set prev_fan = (printer.fan.speed * 255)|round|int if 'fan' in printer else 0 %}
        # First-use this print => long filament purge; later => mm³ purge
        {% set init = v.tool_init|int %}
        {% if tool >= 0 and tool < 16 %}
            {% set bit = (2 ** tool)|int %}
            {% set inited = (init // bit) % 2 %}
        {% else %}
            {% set inited = 0 %}
        {% endif %}
        {% if 'PURGE_MM' in params %}
            {% set flush_purge_mm = params.PURGE_MM|float %}
            {% set flush_use_mm = 1 %}
        {% elif 'PURGE_MM3' in params %}
            {% set flush_purge_mm3 = params.PURGE_MM3|float %}
            {% set flush_use_mm = 0 %}
        {% elif inited == 0 %}
            {% set flush_purge_mm = v.first_use_purge_mm|float %}
            {% set flush_use_mm = 1 %}
        {% else %}
            {% set flush_purge_mm3 = v.purge_volume_mm3|float %}
            {% set flush_use_mm = 0 %}
        {% endif %}
        # Raise-only resume target. Default = current Z (no move on exit if
        # we never lowered). Optional LAYER_Z=+resume_z_extra still never dives.
        {% if 'LAYER_Z' in params %}
            {% set resume_z = params.LAYER_Z|float + v.resume_z_extra|float %}
        {% else %}
            {% set resume_z = printer.toolhead.position.z|float %}
        {% endif %}

        {% if tool < 0 and act < 0 %}
            {action_raise_error("INDX_TC_POST: no active tool (run CHANGE_TOOL first)")}
        {% elif skip_purge %}
            {action_respond_info("INDX_TC_POST: skipped purge (SKIP_PURGE)")}
            M104 S{temp}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={near_temp}
        {% else %}
            SET_GCODE_VARIABLE MACRO=INDX_TC_VARS VARIABLE=saved_pa VALUE={prev_pa}
            SET_GCODE_VARIABLE MACRO=INDX_TC_VARS VARIABLE=saved_fan VALUE={prev_fan}

            # 1-2. Request full temp, travel to station
            M104 S{temp}
            _INDX_TC_GOTO_STATION

            # 3. Shake off residue from the previous tool BEFORE heat wait -
            # waiting first softens it onto the nozzle.
            _INDX_TC_EJECT

            # 4. Lower heat gate (Prusa eject_temp). MINIMUM only - nozzle
            # may already be above eject_temp on a warm tool.
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={eject_temp}

            SAVE_GCODE_STATE NAME=INDX_TC_POST
            G90
            M83

            # 5. Optional finish-lock (E-hidden inside INDX_TC_RETRACT)
            {% if v.do_lock_finish|int %}
                INDX_TC_RETRACT STATE=lock_finish TOOL={tool}
            {% endif %}

            # 6. Fan + PA off for flush
            {% if 'fan' in printer %}
                M106 S{v.flush_fan|int}
            {% endif %}
            SET_PRESSURE_ADVANCE ADVANCE=0

            # 7. Near-full heat before deretract + flush
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={near_temp}

            # 8-10. Deretract, flush, tip retract
            INDX_TC_RETRACT STATE=deretract TOOL={tool}
            {% if flush_use_mm %}
                {action_respond_info("INDX_TC_POST: tool=%d first-use purge %.1f mm filament" % (tool, flush_purge_mm))}
                _INDX_TC_FLUSH PURGE_MM={flush_purge_mm}
            {% else %}
                {action_respond_info("INDX_TC_POST: tool=%d purge %.1f mm3" % (tool, flush_purge_mm3))}
                _INDX_TC_FLUSH PURGE_MM3={flush_purge_mm3}
            {% endif %}
            _INDX_TC_BRUSH
            INDX_TC_RETRACT STATE=post_purge TOOL={tool}
            M400

            # Hide net flush E from gcode (lock_finish / tip already self-hid).
            SET_KINEMATIC_POSITION E={"%.4f"|format(e0)}
            G92 E{"%.4f"|format(e0)}

            RESTORE_GCODE_STATE NAME=INDX_TC_POST MOVE=0

            SET_GCODE_VARIABLE MACRO=INDX_TC_VARS VARIABLE=saved_pa VALUE={prev_pa}
            SET_GCODE_VARIABLE MACRO=INDX_TC_VARS VARIABLE=saved_fan VALUE={prev_fan}
            SET_GCODE_VARIABLE MACRO=INDX_TC_VARS VARIABLE=resume_z VALUE={resume_z}
            _INDX_TC_POST_FINISH TOOL={tool}
        {% endif %}
    {% endif %}

[gcode_macro _INDX_TC_POST_FINISH]
description: Inner - restore PA/fan, exit station, optional tip unretract, resume Z
gcode:
    {% set v = printer["gcode_macro INDX_TC_VARS"] %}
    {% set tool = params.TOOL|default(-1)|int %}
    {% set tip = v.last_tip_retract|float %}
    {% set prev_pa = v.saved_pa|float %}
    {% set prev_fan = v.saved_fan|int %}
    {% set resume_z = v.resume_z|float %}
    SET_PRESSURE_ADVANCE ADVANCE={prev_pa}
    {% if 'fan' in printer %}
        M106 S{prev_fan}
    {% endif %}
    _INDX_TC_EXIT_STATION
    G90
    {% set cur_z = printer.toolhead.position.z|float %}
    {% if cur_z < resume_z %}
        G1 Z{"%.3f"|format(resume_z)} F{"%d"|format((v.travel_speed|float * 60)|int)}
    {% endif %}
    {% if v.unretract_after_exit|int and tip > 0.0 %}
        {% set e0 = printer.gcode_move.gcode_position.e|float %}
        G91
        M83
        G1 E{"%.4f"|format(tip)} F{"%d"|format((v.deretract_feed|float * 60)|int)}
        G90
        SET_KINEMATIC_POSITION E={"%.4f"|format(e0)}
        G92 E{"%.4f"|format(e0)}
        SET_GCODE_VARIABLE MACRO=INDX_TC_VARS VARIABLE=last_tip_retract VALUE=0
        {action_respond_info("INDX_TC_POST: done tool=%d unretracted tip=%.3f" % (tool, tip))}
    {% else %}
        {action_respond_info("INDX_TC_POST: done tool=%d tip_retract=%.3f (still retracted)" % (tool, tip))}
    {% endif %}

#####################################################################
#  INDX_TC_PURGE_TEST - bed line validation after each tool
#  Chained via delayed_gcode so last_tip_retract is read AFTER
#  INDX_TC_POST, and so NEXT is not re-entered while still on the
#  call stack (Klipper forbids recursive macro calls).
#####################################################################

[gcode_macro INDX_TC_PURGE_TEST]
description: Home, T0 line, then T1..Tn with INDX_TC_POST and parallel Y lines. TEMP= required.
variable_temp: 220.0
variable_bed_temp: 60.0
variable_line_len: 120.0
variable_line_gap: 15.0
variable_z: 0.2
variable_line_width: 0.45
variable_extrude_mm: 0.0
variable_print_feed: 1800
variable_max_tool: 4
variable_x0: 0.0
variable_y0: 0.0
variable_y1: 0.0
variable_skip_purge: 0
variable_next_tool: 1
gcode:
    {% if 'TEMP' not in params %}
        {action_raise_error("INDX_TC_PURGE_TEST requires TEMP=<celsius>")}
    {% else %}
        {% set temp = params.TEMP|float %}
        {% set bed_temp = params.BED_TEMP|default(60)|float %}
        {% set line_len = params.LINE_LEN|default(120)|float %}
        {% set line_gap = params.LINE_GAP|default(15)|float %}
        {% set z = params.Z|default(0.2)|float %}
        {% set line_width = params.LINE_WIDTH|default(0.45)|float %}
        {% set v = printer["gcode_macro INDX_TC_VARS"] %}
        {% set dia = v.filament_diameter|float %}
        {% set area = 3.141592653589793 * dia * dia / 4.0 %}
        {% set extrude_mm = params.EXTRUDE_MM|default(line_width * z * line_len / area)|float %}
        {% set f_travel = (v.travel_speed|float * 60)|int %}
        {% set f_print = params.PRINT_FEED|default(1800)|int %}
        {% if 'gcode_macro TOOL_POSITIONS' in printer %}
            {% set tool_count = printer["gcode_macro TOOL_POSITIONS"].tool_count|int %}
        {% else %}
            {% set tool_count = 1 %}
        {% endif %}
        {% set max_tool = params.TOOLS|default(4)|int %}
        {% if max_tool > tool_count - 1 %}
            {% set max_tool = tool_count - 1 %}
        {% endif %}
        {% if max_tool < 0 %}
            {% set max_tool = 0 %}
        {% endif %}
        {% set th = printer.toolhead %}
        {% set cx = (th.axis_minimum.x|float + th.axis_maximum.x|float) / 2.0 %}
        {% set cy = (th.axis_minimum.y|float + th.axis_maximum.y|float) / 2.0 %}
        {% set y0 = cy - line_len / 2.0 %}
        {% set y1 = cy + line_len / 2.0 %}
        {% set half_span = max_tool * line_gap / 2.0 %}
        {% set x0 = cx - half_span %}
        {% set skip = 1 if 'SKIP_PURGE' in params else 0 %}

        SET_GCODE_VARIABLE MACRO=INDX_TC_PURGE_TEST VARIABLE=temp VALUE={temp}
        SET_GCODE_VARIABLE MACRO=INDX_TC_PURGE_TEST VARIABLE=bed_temp VALUE={bed_temp}
        SET_GCODE_VARIABLE MACRO=INDX_TC_PURGE_TEST VARIABLE=line_len VALUE={line_len}
        SET_GCODE_VARIABLE MACRO=INDX_TC_PURGE_TEST VARIABLE=line_gap VALUE={line_gap}
        SET_GCODE_VARIABLE MACRO=INDX_TC_PURGE_TEST VARIABLE=z VALUE={z}
        SET_GCODE_VARIABLE MACRO=INDX_TC_PURGE_TEST VARIABLE=line_width VALUE={line_width}
        SET_GCODE_VARIABLE MACRO=INDX_TC_PURGE_TEST VARIABLE=extrude_mm VALUE={extrude_mm}
        SET_GCODE_VARIABLE MACRO=INDX_TC_PURGE_TEST VARIABLE=print_feed VALUE={f_print}
        SET_GCODE_VARIABLE MACRO=INDX_TC_PURGE_TEST VARIABLE=max_tool VALUE={max_tool}
        SET_GCODE_VARIABLE MACRO=INDX_TC_PURGE_TEST VARIABLE=x0 VALUE={x0}
        SET_GCODE_VARIABLE MACRO=INDX_TC_PURGE_TEST VARIABLE=y0 VALUE={y0}
        SET_GCODE_VARIABLE MACRO=INDX_TC_PURGE_TEST VARIABLE=y1 VALUE={y1}
        SET_GCODE_VARIABLE MACRO=INDX_TC_PURGE_TEST VARIABLE=skip_purge VALUE={skip}
        SET_GCODE_VARIABLE MACRO=INDX_TC_PURGE_TEST VARIABLE=next_tool VALUE=1

        G28
        M140 S{bed_temp}
        CHANGE_TOOL TOOL=0
        M104 S{temp}
        M190 S{bed_temp}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - 3}

        # T0 baseline line (no purge station)
        G90
        M83
        G1 Z{"%.3f"|format(z + 2.0)} F{"%d"|format(f_travel)}
        G1 X{"%.3f"|format(x0)} Y{"%.3f"|format(y0)} F{"%d"|format(f_travel)}
        G1 Z{"%.3f"|format(z)} F{"%d"|format(f_travel)}
        G1 Y{"%.3f"|format(y1)} E{"%.4f"|format(extrude_mm)} F{"%d"|format(f_print)}
        G1 Z{"%.3f"|format(z + 2.0)} F{"%d"|format(f_travel)}

        _INDX_TC_PURGE_TEST_NEXT TOOL=1
    {% endif %}

[gcode_macro _INDX_TC_PURGE_TEST_NEXT]
description: Inner - CHANGE_TOOL + INDX_TC_POST then hand off to line print
gcode:
    {% set t = params.TOOL|default(1)|int %}
    {% set st = printer["gcode_macro INDX_TC_PURGE_TEST"] %}
    {% set max_tool = st.max_tool|int %}
    {% if t > max_tool %}
        M104 S0
        UPDATE_DELAYED_GCODE ID=_INDX_TC_PURGE_TEST_SCHED DURATION=0
        {action_respond_info("INDX_TC_PURGE_TEST: done tools T0..T%d" % max_tool)}
    {% else %}
        CHANGE_TOOL TOOL={t}
        {% if st.skip_purge|int %}
            INDX_TC_POST TEMP={st.temp} SKIP_PURGE
        {% else %}
            INDX_TC_POST TEMP={st.temp}
        {% endif %}
        _INDX_TC_PURGE_TEST_LINE TOOL={t}
    {% endif %}

[gcode_macro _INDX_TC_PURGE_TEST_LINE]
description: Inner - print one Y line after purge; unretract tip on the bed
gcode:
    {% set t = params.TOOL|int %}
    {% set st = printer["gcode_macro INDX_TC_PURGE_TEST"] %}
    {% set v = printer["gcode_macro INDX_TC_VARS"] %}
    {% set tip = v.last_tip_retract|float %}
    {% if tip <= 0.0 %}
        {% set tip = v.post_purge_retract|float %}
    {% endif %}
    {% set xn = st.x0|float + t * st.line_gap|float %}
    {% set y0 = st.y0|float %}
    {% set y1 = st.y1|float %}
    {% set z = st.z|float %}
    {% set extrude_mm = st.extrude_mm|float %}
    {% set f_travel = (v.travel_speed|float * 60)|int %}
    {% set f_print = st.print_feed|int %}
    {% set f_ret = (v.retract_feed|float * 60)|int %}
    G90
    M83
    # Travel with tip still retracted (POST leaves tip in)
    G1 Z{"%.3f"|format(z + 2.0)} F{"%d"|format(f_travel)}
    G1 X{"%.3f"|format(xn)} Y{"%.3f"|format(y0)} F{"%d"|format(f_travel)}
    G1 Z{"%.3f"|format(z)} F{"%d"|format(f_travel)}
    {% if tip > 0.0 %}
        G1 E{"%.4f"|format(tip)} F{"%d"|format(f_ret)}
        SET_GCODE_VARIABLE MACRO=INDX_TC_VARS VARIABLE=last_tip_retract VALUE=0
    {% endif %}
    G1 Y{"%.3f"|format(y1)} E{"%.4f"|format(extrude_mm)} F{"%d"|format(f_print)}
    G1 E{"-%.4f"|format(v.post_purge_retract|float)} F{"%d"|format(f_ret)}
    G1 Z{"%.3f"|format(z + 2.0)} F{"%d"|format(f_travel)}
    # Break call stack before re-entering _INDX_TC_PURGE_TEST_NEXT
    SET_GCODE_VARIABLE MACRO=INDX_TC_PURGE_TEST VARIABLE=next_tool VALUE={t + 1}
    UPDATE_DELAYED_GCODE ID=_INDX_TC_PURGE_TEST_SCHED DURATION=0.05

[delayed_gcode _INDX_TC_PURGE_TEST_SCHED]
gcode:
    {% set t = printer["gcode_macro INDX_TC_PURGE_TEST"].next_tool|int %}
    _INDX_TC_PURGE_TEST_NEXT TOOL={t}
