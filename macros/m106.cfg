#####################################################################
#  M106 - part cooling fan with global speed modifier
#####################################################################
#
#  Optional include (printer-specific):
#    [include m106.cfg]
#
#  Requires [fan]. Slicer M106 S= is scaled by `modifier`
#  (1.0 = 100% of commanded). Change mid-print; last commanded S is
#  re-applied immediately:
#    SET_FAN_MODIFIER FACTOR=0.8
#
#  M107 goes through M106 S0 so last_s stays in sync.
#
#####################################################################

[gcode_macro M106]
rename_existing: M106.1
variable_modifier: 1.0
variable_last_s: 0
description: Set fan speed; scaled by modifier (SET_FAN_MODIFIER)
gcode:
    {% set s = params.S|default(255)|float %}
    {% set s = [s, 0]|max %}
    {% set m = printer["gcode_macro M106"].modifier|float %}
    {% set adj = [[s * m, 0]|max, 255]|min %}
    SET_GCODE_VARIABLE MACRO=M106 VARIABLE=last_s VALUE={s}
    M106.1 S{adj}

[gcode_macro M107]
rename_existing: M107.1
description: Turn fan off (clears last M106 S)
gcode:
    M106 S0

[gcode_macro SET_FAN_MODIFIER]
description: Scale all M106 speeds. FACTOR=1.0 is 100% of commanded.
gcode:
    {% if 'FACTOR' not in params %}
        {action_raise_error("SET_FAN_MODIFIER requires FACTOR=<n> (1.0 = 100%)")}
    {% endif %}
    {% set f = params.FACTOR|float %}
    {% if f < 0 %}
        {action_raise_error("SET_FAN_MODIFIER FACTOR must be >= 0")}
    {% endif %}
    {% set last = printer["gcode_macro M106"].last_s|float %}
    SET_GCODE_VARIABLE MACRO=M106 VARIABLE=modifier VALUE={f}
    M106 S{last}
    RESPOND MSG="FAN_MODIFIER: factor={f} last_s={last}"
