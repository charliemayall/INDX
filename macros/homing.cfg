#####################################################################
#  INDX HOMING OVERRIDE
#####################################################################
#
#  Include AFTER the other INDX macros:
#    [include indx/indx.cfg]
#    [include indx/indx-tc-macros.cfg]
#    [include indx/indx-cal.cfg]
#    [include indx/homing.cfg]
#
#  Klipper allows only ONE [homing_override]. If your printer.cfg
#  already has one (sensorless current, bed raiser, etc.), merge this
#  sequence into yours - do not include both.
#
#  Sequence (full G28):
#    1. _INDX_SAFE_Z_HOP before any axis home:
#       Z known: ensure at/above probe_z_clearance; Z unknown: relative +probe_z_clearance
#    2. Home Y if needed (X always requires Y - G28 X with Y unknown
#       homes Y first)
#    3. Before X: if Y already known, clear past clearance_y when on
#       the dock side (dock_dir). Just-homed Y: home X immediately.
#    4. Home X
#    5. If Z requested: VERIFY, keep seated tool (or pick T0 if empty),
#       re-apply that tool's offsets, VERIFY again, probe Z
#
#  G28 Z homes with whatever tool is seated:
#    TOOL_STATE_VERIFY (report-only) then _INDX_HOME_Z_AFTER_SOFT
#      (Jinja split - last_ok is only readable in the follow-up macro)
#      error only if active_tool==-1 but load cell sees a tool
#      Seated tool (active_tool >= 0): keep it; empty head: CHANGE_TOOL T0
#      Re-apply that tool's XY/Z offsets (MOVE=0) before probe
#    TOOL_STATE_VERIFY again then _INDX_HOME_Z_AFTER_HARD - seated or abort
#    After probe: SAVE_VARIABLE z_home_tool for support/debug
#  CAL_Z offsets stay T0-relative; toolchange still applies tool_z+global_z.
#  XY must be homed before G28 Z (G28 Z alone does not home XY).
#
#  Sensorless XY: add your TMC current reduce/restore around the
#  G28 Y / G28 X lines if your printer needs it.
#
#  Manual check:
#    - G28 with locked tool (any Tn): Y, X, Z succeed without docking to T0
#    - G28 Z with XY unhomed: errors
#    - G28 Z with empty head: dock-picks T0, then probes (if XY homed)
#    - G28 X Y only: no tool pickup, no Z move
#    - G28 X with Y unknown: homes Y, then homes X
#    - G28 X with Y known on dock side: clears to clearance_y, then X
#
#####################################################################

[homing_override]
axes: xyz
gcode:
    {% set home_all = not ('X' in params or 'Y' in params or 'Z' in params) %}
    {% set home_x = home_all or 'X' in params %}
    {% set home_z = home_all or 'Z' in params %}
    # X requires Y: G28 X with Y unknown homes Y first #
    {% set home_y = home_all or 'Y' in params
        or (home_x and "y" not in printer.toolhead.homed_axes) %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}

    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=homing_busy VALUE=1

    # 1. Clear Z before any axis home
    _INDX_SAFE_Z_HOP

    # 2. Home Y first (dock is usually on Y-min; X-first can sweep into tools)
    {% if home_y %}
        G28 Y
    {% endif %}

    # 3. Before X: if Y was already known, ensure clear of docks.
    # Just-homed Y: endstop is fine for X - home X immediately.
    {% if home_x %}
        {% if not home_y %}
            {% set cur_y = printer.toolhead.position.y|float %}
            {% set clear_y = tp.clearance_y|float %}
            {% if (cur_y - clear_y) * (tp.dock_dir|float) > 0 %}
                G90
                G0 Y{clear_y} F3000
            {% endif %}
        {% endif %}
        G28 X
    {% endif %}

    # 4. Z needs a seated tool (load cell = nozzle probe)
    {% if home_z %}
        _INDX_HOME_Z
    {% else %}
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=homing_busy VALUE=0
    {% endif %}

[gcode_macro _INDX_SAFE_Z_HOP]
description: Inner - clear Z to probe_z_clearance before any axis home
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set z_clr = tp.probe_z_clearance|float %}
    {% if "z" not in printer.toolhead.homed_axes %}
        SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z
        G91
        G0 Z{z_clr} F900
        G90
        SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=Z
    {% elif printer.toolhead.position.z|float < z_clr %}
        G90
        G0 Z{z_clr} F900
    {% endif %}

[gcode_macro _INDX_HOME_Z]
description: Inner - ensure a seated tool (keep current, or T0 if empty), then probe Z
variable_home_tool: 0
gcode:
    {% if "xy" not in printer.toolhead.homed_axes %}
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=homing_busy VALUE=0
        {action_raise_error("Must home X and Y before Z")}
    {% endif %}

    # Report-only verify, then read last_ok in a follow-up (Jinja cannot
    # see printer.tool_state updates in this same macro after the call).
    {% if 'tool_state' in printer %}
        TOOL_STATE_VERIFY EXPECT=LOADED ON_FAIL=none QUIET=1
    {% endif %}
    _INDX_HOME_Z_AFTER_SOFT

[gcode_macro _INDX_HOME_Z_AFTER_SOFT]
description: Inner - after soft VERIFY: keep seated tool or pick T0, re-apply offsets, recheck
gcode:
    # On this branch last_ok lives on printer.tool_state (not VERIFY_TOOL_PRESENT).
    {% set last_ok = printer["tool_state"].last_ok|default(-1)|int if 'tool_state' in printer else -1 %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}

    # Refuse when a tool is on the load cell but soft-state is unknown
    {% if act == -1 and last_ok == 1 %}
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=homing_busy VALUE=0
        {action_raise_error("Cannot home Z: tool detected but active_tool is unknown (-1). Run CHANGE_TOOL or fix latch state.")}
    {% endif %}

    # Keep seated tool; empty head falls back to T0
    {% set home_tool = act if act >= 0 else 0 %}
    SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z VARIABLE=home_tool VALUE={home_tool}
    {% if act < 0 %}
        CHANGE_TOOL TOOL=0
    {% endif %}

    # Re-apply home tool offsets before probe (MOVE=0 - no Z motion mid-home)
    {% set svv = printer.save_variables.variables %}
    {% set tool_x = svv["t" ~ home_tool ~ "_offset_x"]|default(0.0)|float %}
    {% set tool_y = svv["t" ~ home_tool ~ "_offset_y"]|default(0.0)|float %}
    {% set tool_z = svv["t" ~ home_tool ~ "_offset_z"]|default(0.0)|float %}
    {% set global_z = svv.global_z_offset|default(0.0)|float %}
    SET_GCODE_OFFSET X={"%.3f"|format(tool_x)} Y={"%.3f"|format(tool_y)} Z='{"%.3f"|format(tool_z + global_z)}' MOVE=0

    # Recheck after optional T0 pickup; read last_ok in a follow-up before Z
    {% if 'tool_state' in printer %}
        TOOL_STATE_VERIFY EXPECT=LOADED ON_FAIL=none QUIET=1
    {% endif %}
    _INDX_HOME_Z_AFTER_HARD

[gcode_macro _INDX_HOME_Z_AFTER_HARD]
description: Inner - after recheck: abort if not seated, else probe Z
gcode:
    {% set home_tool = printer["gcode_macro _INDX_HOME_Z"].home_tool|int %}
    {% set last_ok = printer["tool_state"].last_ok|default(-1)|int if 'tool_state' in printer else -1 %}
    {% if 'tool_state' in printer and last_ok != 1 %}
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=homing_busy VALUE=0
        {action_raise_error("T%d not seated - cannot home Z" % (home_tool,))}
    {% endif %}

    _INDX_HOME_Z_PROBE

[gcode_macro _INDX_HOME_Z_PROBE]
description: Inner - move to probe XY and G28 Z
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set th = printer.toolhead %}
    {% set px = tp.probe_x|float %}
    {% set py = tp.probe_y|float %}
    {% if px < 0 %}
        {% set px = (th.axis_minimum.x + th.axis_maximum.x) / 2 %}
    {% endif %}
    {% if py < 0 %}
        {% set py = (th.axis_minimum.y + th.axis_maximum.y) / 2 %}
    {% endif %}

    G90
    {% if "xy" in printer.toolhead.homed_axes %}
        G0 X{"%.3f"|format(px)} Y{"%.3f"|format(py)} F6000
    {% endif %}
    G28 Z
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    SAVE_VARIABLE VARIABLE=z_home_tool VALUE={act}
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=homing_busy VALUE=0


#####################################################################
#  CONVERGENT Z HOME (standalone - does not replace G28 Z)
#####################################################################
#
#  Plastic on the nozzle can make a single load-cell Z home sit high.
#  HOME_Z_CONVERGE probes at X/Y until a 4-sample window converges
#  (sample variance < (0.005 mm)^2, same as CAL_Z). Then sets Z from
#  the window median via SET_KINEMATIC_POSITION (bed surface -> Z=0).
#
#  If the window does not converge within MAX_SAMPLES probes, move
#  X +5 mm and try again. At most RETRY extra XY spots after the first.
#
#  Usage (XYZ must already be homed; seat a tool first):
#    HOME_Z_CONVERGE X=<mm> Y=<mm> [MAX_SAMPLES=7] [RETRY=2]
#
#####################################################################

[gcode_macro HOME_Z_CONVERGE]
description: Probe at X/Y until Z samples converge, then SET_KINEMATIC_POSITION from median. Shifts X+5mm on failure.
variable_max_samples: 7
variable_retry: 2
variable_probe_speed: 3.0
variable_probe_retract: 1.0
variable_shift_x: 5.0
variable_probe_x: 0.0
variable_probe_y: 0.0
variable_probe_count: 0
variable_since_shift: 0
variable_win_count: 0
variable_win_pos: 0
variable_shift_attempts: 0
variable_win_0: 0.0
variable_win_1: 0.0
variable_win_2: 0.0
variable_win_3: 0.0
gcode:
    {% if 'X' not in params or 'Y' not in params %}
        {action_raise_error("HOME_Z_CONVERGE requires X=<mm> Y=<mm>")}
    {% endif %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        {action_raise_error("HOME_Z_CONVERGE: home XYZ first (G28), then re-run")}
    {% endif %}

    {% set px = params.X|float %}
    {% set py = params.Y|float %}
    {% set ms = params.MAX_SAMPLES|default(7)|int %}
    {% set rt = params.RETRY|default(2)|int %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set z_clr = tp.probe_z_clearance|float %}

    SET_GCODE_VARIABLE MACRO=HOME_Z_CONVERGE VARIABLE=probe_x VALUE={px}
    SET_GCODE_VARIABLE MACRO=HOME_Z_CONVERGE VARIABLE=probe_y VALUE={py}
    SET_GCODE_VARIABLE MACRO=HOME_Z_CONVERGE VARIABLE=max_samples VALUE={ms}
    SET_GCODE_VARIABLE MACRO=HOME_Z_CONVERGE VARIABLE=retry VALUE={rt}
    SET_GCODE_VARIABLE MACRO=HOME_Z_CONVERGE VARIABLE=probe_count VALUE=0
    SET_GCODE_VARIABLE MACRO=HOME_Z_CONVERGE VARIABLE=since_shift VALUE=0
    SET_GCODE_VARIABLE MACRO=HOME_Z_CONVERGE VARIABLE=win_count VALUE=0
    SET_GCODE_VARIABLE MACRO=HOME_Z_CONVERGE VARIABLE=win_pos VALUE=0
    SET_GCODE_VARIABLE MACRO=HOME_Z_CONVERGE VARIABLE=shift_attempts VALUE=0

    RESPOND MSG="HOME_Z_CONVERGE: X={'%.3f'|format(px)} Y={'%.3f'|format(py)}  SD < 0.005 mm over 4  max_samples={ms}  retry={rt}"

    G90
    G0 Z{'%.3f'|format(z_clr)} F1500
    G0 X{'%.3f'|format(px)} Y{'%.3f'|format(py)} F6000
    UPDATE_DELAYED_GCODE ID=_hzc_probe_loop DURATION=0.1

[gcode_macro _HZC_PROBE_STEP]
description: Inner - relative retract, probe, hand off to _HZC_READ
gcode:
    {% set cfg = printer["gcode_macro HOME_Z_CONVERGE"] %}
    G91
    G0 Z{cfg.probe_retract} F1500
    G90
    PROBE PROBE_SPEED={cfg.probe_speed}
    _HZC_READ

[gcode_macro _HZC_READ]
description: Inner - update SD window, converge / shift X / fail
gcode:
    {% set cfg = printer["gcode_macro HOME_Z_CONVERGE"] %}
    {% set z = printer.probe.last_z_result|float %}
    {% set probe_count = cfg.probe_count|int %}
    {% set since_shift = cfg.since_shift|int %}
    {% set win_count = cfg.win_count|int %}
    {% set win_pos = cfg.win_pos|int %}
    {% set shift_attempts = cfg.shift_attempts|int %}
    {% set max_samples = cfg.max_samples|int %}
    {% set retry = cfg.retry|int %}
    {% set threshold_sq = 0.000025 %}

    {% set new_probe_count = probe_count + 1 %}
    {% set new_since_shift = since_shift + 1 %}
    {% set new_win_pos = (win_pos + 1) % 4 %}
    {% set new_win_count = [win_count + 1, 4]|min %}

    # Build updated window in Jinja - SET_GCODE_VARIABLE has not run yet
    {% set wns = namespace(w0 = cfg.win_0|float,
                           w1 = cfg.win_1|float,
                           w2 = cfg.win_2|float,
                           w3 = cfg.win_3|float) %}
    {% if win_pos == 0 %}{% set wns.w0 = z %}{% endif %}
    {% if win_pos == 1 %}{% set wns.w1 = z %}{% endif %}
    {% if win_pos == 2 %}{% set wns.w2 = z %}{% endif %}
    {% if win_pos == 3 %}{% set wns.w3 = z %}{% endif %}

    {% set cns = namespace(converged=false, variance=0.0) %}
    {% if new_win_count >= 4 %}
        {% set m = (wns.w0 + wns.w1 + wns.w2 + wns.w3) / 4.0 %}
        {% set cns.variance = ((wns.w0-m)**2 + (wns.w1-m)**2 + (wns.w2-m)**2 + (wns.w3-m)**2) / 3.0 %}
        {% set cns.converged = cns.variance < threshold_sq %}
    {% endif %}

    {% set converged = cns.converged %}
    {% set should_shift = (new_since_shift >= max_samples) and not converged %}

    {% if new_win_count < 4 %}
        RESPOND MSG="  HZC probe {new_probe_count}: {'%.4f'|format(z)}  (window {new_win_count}/4)"
    {% elif converged %}
        RESPOND MSG="  HZC probe {new_probe_count}: {'%.4f'|format(z)}  ok var={'%.1f'|format(cns.variance * 1e6)} um^2"
    {% else %}
        RESPOND MSG="  HZC probe {new_probe_count}: {'%.4f'|format(z)}  no var={'%.1f'|format(cns.variance * 1e6)} um^2  ({new_since_shift}/{max_samples})"
    {% endif %}

    SET_GCODE_VARIABLE MACRO=HOME_Z_CONVERGE VARIABLE=win_{win_pos} VALUE={'%.6f'|format(z)}
    SET_GCODE_VARIABLE MACRO=HOME_Z_CONVERGE VARIABLE=win_pos VALUE={new_win_pos}
    SET_GCODE_VARIABLE MACRO=HOME_Z_CONVERGE VARIABLE=win_count VALUE={new_win_count}
    SET_GCODE_VARIABLE MACRO=HOME_Z_CONVERGE VARIABLE=probe_count VALUE={new_probe_count}

    {% if converged %}
        # Persist the Jinja window so _HZC_APPLY can median without a race
        SET_GCODE_VARIABLE MACRO=HOME_Z_CONVERGE VARIABLE=win_0 VALUE={'%.6f'|format(wns.w0)}
        SET_GCODE_VARIABLE MACRO=HOME_Z_CONVERGE VARIABLE=win_1 VALUE={'%.6f'|format(wns.w1)}
        SET_GCODE_VARIABLE MACRO=HOME_Z_CONVERGE VARIABLE=win_2 VALUE={'%.6f'|format(wns.w2)}
        SET_GCODE_VARIABLE MACRO=HOME_Z_CONVERGE VARIABLE=win_3 VALUE={'%.6f'|format(wns.w3)}
        RESPOND MSG="  HZC converged after {new_probe_count} probes - applying median"
        UPDATE_DELAYED_GCODE ID=_hzc_apply DURATION=0.1
    {% elif should_shift %}
        {% if shift_attempts >= retry %}
            UPDATE_DELAYED_GCODE ID=_hzc_fail DURATION=0.1
        {% else %}
            RESPOND MSG="  HZC no convergence after {max_samples} probes - shift X+{cfg.shift_x} (retry {shift_attempts + 1}/{retry})"
            SET_GCODE_VARIABLE MACRO=HOME_Z_CONVERGE VARIABLE=shift_attempts VALUE={shift_attempts + 1}
            SET_GCODE_VARIABLE MACRO=HOME_Z_CONVERGE VARIABLE=since_shift VALUE=0
            SET_GCODE_VARIABLE MACRO=HOME_Z_CONVERGE VARIABLE=win_count VALUE=0
            SET_GCODE_VARIABLE MACRO=HOME_Z_CONVERGE VARIABLE=win_pos VALUE=0
            UPDATE_DELAYED_GCODE ID=_hzc_shift_move DURATION=0.1
        {% endif %}
    {% else %}
        SET_GCODE_VARIABLE MACRO=HOME_Z_CONVERGE VARIABLE=since_shift VALUE={new_since_shift}
        UPDATE_DELAYED_GCODE ID=_hzc_probe_loop DURATION=0.1
    {% endif %}

[gcode_macro _HZC_SHIFT]
description: Inner - lift, move X+shift_x, restart convergence window
gcode:
    {% set cfg = printer["gcode_macro HOME_Z_CONVERGE"] %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set th = printer.toolhead %}
    {% set z_clr = tp.probe_z_clearance|float %}
    {% set nx = cfg.probe_x|float + cfg.shift_x|float %}
    {% set py = cfg.probe_y|float %}

    {% if nx > th.axis_maximum.x|float %}
        UPDATE_DELAYED_GCODE ID=_hzc_fail DURATION=0.1
    {% else %}
        SET_GCODE_VARIABLE MACRO=HOME_Z_CONVERGE VARIABLE=probe_x VALUE={nx}
        G90
        G0 Z{'%.3f'|format(z_clr)} F1500
        G0 X{'%.3f'|format(nx)} Y{'%.3f'|format(py)} F6000
        RESPOND MSG="  HZC probing at X={'%.3f'|format(nx)} Y={'%.3f'|format(py)}"
        UPDATE_DELAYED_GCODE ID=_hzc_probe_loop DURATION=0.1
    {% endif %}

[gcode_macro _HZC_APPLY]
description: Inner - median of converged window, SET_KINEMATIC_POSITION, lift
gcode:
    {% set cfg = printer["gcode_macro HOME_Z_CONVERGE"] %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set z_clr = tp.probe_z_clearance|float %}
    {% set ns = namespace(data=[cfg.win_0|float, cfg.win_1|float, cfg.win_2|float, cfg.win_3|float]) %}
    {% set sorted_samples = ns.data|sort %}
    {% set median = (sorted_samples[1] + sorted_samples[2]) / 2.0 %}
    {% set cur_z = printer.toolhead.position.z|float %}
    {% set new_z = cur_z - median %}

    SET_KINEMATIC_POSITION Z={'%.6f'|format(new_z)} SET_HOMED=Z
    G90
    G0 Z{'%.3f'|format(z_clr)} F1500
    RESPOND MSG="HOME_Z_CONVERGE done: median={'%.4f'|format(median)}  Z set so bed=0 (kinematic Z={'%.4f'|format(new_z)} at trigger)"

[gcode_macro _HZC_FAIL]
description: Inner - lift then error after exhausted retries
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set z_clr = tp.probe_z_clearance|float %}
    G90
    G0 Z{'%.3f'|format(z_clr)} F1500
    _HZC_FAIL_RAISE

[gcode_macro _HZC_FAIL_RAISE]
description: Inner - raise after lift (raise aborts template eval)
gcode:
    {% set cfg = printer["gcode_macro HOME_Z_CONVERGE"] %}
    {action_raise_error("HOME_Z_CONVERGE: no convergence after %d spot(s) (retry=%d). Clean the nozzle and retry." % (cfg.shift_attempts|int + 1, cfg.retry|int))}

[delayed_gcode _hzc_probe_loop]
gcode:
    _HZC_PROBE_STEP

[delayed_gcode _hzc_shift_move]
gcode:
    _HZC_SHIFT

[delayed_gcode _hzc_apply]
gcode:
    _HZC_APPLY

[delayed_gcode _hzc_fail]
gcode:
    _HZC_FAIL
