#####################################################################
#  M109 - set hotend temp and wait
#####################################################################
#
#  Optional include (printer-specific), after m104.cfg:
#    [include m104.cfg]
#    [include m109.cfg]
#
#  Uses TEMPERATURE_WAIT MINIMUM only when heating so an already-hot
#  nozzle does not hang waiting to cool into a MAXIMUM window.
#  Optional R= waits until at or below target (cool-down).
#  Strips any T= by calling M104 S= only (see m104.cfg).
#
#####################################################################

[gcode_macro M109]
rename_existing: M109.1
description: Set hotend temperature and wait (S= heat, R= cool)
gcode:
    {% if 'S' not in params and 'R' not in params %}
        {action_raise_error("M109 requires S=<temp> or R=<temp>")}
    {% endif %}
    {% set cool = 1 if 'R' in params and 'S' not in params else 0 %}
    {% set s = (params.S if 'S' in params else params.R)|float %}
    M104 S{s}
    {% if s != 0 %}
        {% if cool %}
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={s+3}
        {% else %}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s-3}
        {% endif %}
    {% endif %}
