#####################################################################
#  INDX TOOL STATE (tool_state klippy extra configuration)
#####################################################################
#
#  Requires the tool_state extra installed into the klippy checkout
#  (local repo: tool_state/, run ./install.sh <klipper_dir>).
#
#  Include from printer.cfg alongside the other INDX files:
#    [include indx/indx-tc-macros.cfg]
#    [include indx/indx-tool-state.cfg]
#    [include indx/indx-filament-force.cfg]  # optional experimental
#    [include indx/indx-helpers.cfg]
#
#  The extra owns tool presence verification: it samples the configured
#  sensors, compares against the expected state (loaded after pickup,
#  empty after park), and runs the fail behaviour below. The gcode
#  templates in this file supply the INDX-specific motion; the extra
#  supplies all state, retries and pause/resume bookkeeping.
#
#  Sensors are optional and independent: keep [tool_state load_cell]
#  for latch preload detect, add [tool_state ringdown] for coil
#  presence (Kalico feat/indx-ov-handling), or run either alone.
#
#  Mid-print monitoring: while the heater is on, inductive_presence
#  updates from overvoltage trips. At idle, verify fires
#  INDX_COIL_PRESENCE. Enable the global monitor with TOOL_STATE_MONITOR
#  ENABLE=1 INTERVAL_MS=250 from PRINT_START, or set monitor: True
#  below. A tool that goes missing soft-pauses the print; seat it by
#  hand, then RESUME rechecks and continues.
#
#####################################################################

[tool_state]
# soft: mid-print PAUSE + hand-fix + RESUME recheck; idle -> error.
# Set to retry to redo the pickup dance automatically before escalating.
on_fail: soft
max_retries: 2
retry_exhausted: soft
# Samples per verification, separated by settle_ms; stops early on pass.
attempts: 3
settle_ms: 250
# Background monitor (off at boot; toggle with TOOL_STATE_MONITOR).
monitor: False
monitor_interval_ms: 250
monitor_confirm: 2
fail_gcode:
    # Cleanup before escalation. Only meaningful after a failed pickup
    # (EXPECT=loaded): the latch closed on nothing or a soft seat, so open
    # it and leave the dock before the extra raises or pauses. Z stays
    # hopped; PAUSE parks and the client resume restores position.
    {% if params.EXPECT == "loaded" %}
        {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
        _TC_SET_ROTATION_DIST
        _TC_LATCH_MOVE E={c.full_open_e} F={c.latch_feedrate} I={c.run_current}
        _TC_RESTORE_ROTATION_DIST
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=toolhead_state VALUE=2
        SAVE_VARIABLE VARIABLE=toolhead_state VALUE=2
        _LINEAR_EXIT
        # Hard fail aborts remaining pickup gcode before _PICKUP_TOOL_FINISH;
        # drop suppress so filament_force is not stuck muted.
        {% if 'filament_force' in printer %}
            FILAMENT_FORCE_SUPPRESS ENABLE=0
        {% endif %}
    {% endif %}
retry_gcode:
    # Redo the seat + lock for a failed pickup. Runs with the head still
    # at the dock, latch closed on nothing / a soft seat. Motion only -
    # the extra re-verifies afterwards; do not call TOOL_STATE_VERIFY here.
    {% if params.EXPECT == "loaded" and params.TOOL|int >= 0 %}
        {% set c = printer["gcode_macro _INDX_CONSTANTS"] %}
        {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
        {% set tool = tp.tools[params.TOOL|int] %}
        {% set dock_y = tool.dock_y %}
        {% set trigger_y = dock_y - tp.dock_dir * tp.trigger_offset %}
        _TC_SET_ROTATION_DIST
        _TC_LATCH_MOVE E={c.full_open_e} F={c.latch_feedrate} I={c.run_current}
        G90
        G1 Y{"%.3f"|format(trigger_y)} F{c.approach_feedrate}
        G1 Y{"%.3f"|format(dock_y)} F{c.engage_feedrate}
        _TC_LATCH_MOVE E={c.full_lock_e} F={c.latch_feedrate} I={c.run_current}
        _TC_RESTORE_ROTATION_DIST
    {% endif %}
recover_gcode:
    # Runs after a successful RESUME recheck, before resuming. For a
    # recovered pickup, sync the soft state the aborted pickup never
    # recorded: lock state, offsets, heat, toolchange bookkeeping.
    # An empty-recheck (failed park) has nothing to sync.
    {% if params.EXPECT == "loaded" and params.TOOL|int >= 0 %}
        {% set t = params.TOOL|int %}
        SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=toolhead_state VALUE=0
        SAVE_VARIABLE VARIABLE=toolhead_state VALUE=0
        {% set svv = printer.save_variables.variables %}
        {% set tool_z = svv["t" ~ t ~ "_offset_z"]|default(0.0)|float %}
        {% set global_z = svv.global_z_offset|default(0.0)|float %}
        SET_GCODE_OFFSET X={svv["t"~t~"_offset_x"]|default(0.0)} Y={svv["t"~t~"_offset_y"]|default(0.0)} Z='{"%.3f"|format(tool_z + global_z)}' MOVE=1
        {% if params.TARGET|float > 0 %}
            M104 S{params.TARGET|float}
        {% endif %}
        _RECORD_TOOLCHANGE TOOL={t}
    {% endif %}
# resume_gcode not set: the extra runs _CLIENT_RESUME when present, else
# RESUME_BASE (the rename installed by the RESUME wrapper in helpers).

[tool_state load_cell]
# Latch preload via the host load cell. Detect uses absolute grams vs the
# empty-head reference: force_g + tare_force (Z probing re-tares the cell,
# so raw force_g alone is wrong after home/probe).
# Cal may cinch to ~1600 g once; pickup uses full_lock_e only (no cinch),
# so normal-lock absolute preload is often below 1600. Raise min_force_g
# if false negatives; lower only with care (false positives heat an empty
# coil).
load_cell: load_cell_probe
min_force_g: 1000
# fail closed: no reading / uncalibrated counts as a failed check. Do not
# set to pass on machines that rely on the load cell for pickup safety.
unknown: fail
# Keep the load cell out of the background monitor: print forces ride on
# top of the preload, so mid-print force reads are noisy.
monitor: False

# Coil presence via 100 V overvoltage trips. Verify fires
# INDX_COIL_PRESENCE when idle and reads inductive_presence from
# printer.indx: present = loaded, absent = empty, anything else
# unknown. Coil timings must already be set (INDX_CALIBRATE).
# max_age guards against stale idle readings.
[tool_state ringdown]
indx_object: indx
unknown: fail
monitor: True
max_age: 2.0

