#####################################################################
#  M104 - set hotend temp (INDX single physical extruder)
#####################################################################
#
#  Optional include (printer-specific):
#    [include m104.cfg]
#    [include m109.cfg]
#
#  Orca / multi-extruder slicer profiles emit M104 S… T1 (T2, …) for
#  per-tool heat. INDX has only [extruder]; native M104 Tn looks up
#  extruderN and raises "Extruder not configured". This wrapper applies
#  S= to the active extruder and ignores T=.
#
#  Include before m109.cfg so M109's M104 call uses this macro.
#
#####################################################################

[gcode_macro M104]
rename_existing: M104.1
description: Set hotend temperature; ignore T= (single INDX extruder)
gcode:
    {% set s = params.S|default(0)|float %}
    M104.1 S{s}
