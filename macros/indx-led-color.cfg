#####################################################################
#  INDX FILAMENT COLOUR -> SMART HEAD LED
#####################################################################
#
#  Optional. Slicer hex -> INDX_LED_FORCE_COLOR on pickup.
#  Requires Kalico INDX. Forced colour suppresses heater status LEDs;
#  park / CLEAR restores them.
#
#    [include indx/indx-led-color.cfg]
#
#  Orca (quotes optional; hex is read from rawparams so A-F is not
#  eaten by Klipper's traditional parameter parser):
#    T{next_extruder} TEMP={temperature[next_extruder]} \
#        COLOR="{filament_colour[next_extruder]}"
#    PRINT_START ... COLOR="{filament_colour[initial_tool]}"
#
#    SET_FILAMENT_COLOR TOOL=0 COLOR=00AE42
#    SET_FILAMENT_COLOR CLEAR=1
#
#####################################################################

[gcode_macro _FILAMENT_COLOR_VARS]
# Packed 0xRRGGBB per physical tool, -1 = unset. Extend if tool_count > 8.
variable_rgb: [-1, -1, -1, -1, -1, -1, -1, -1]
gcode:

[gcode_macro SET_FILAMENT_COLOR]
description: Store filament LED colour. TOOL= COLOR=hex, or CLEAR=1.
gcode:
    {% set rgb = printer["gcode_macro _FILAMENT_COLOR_VARS"].rgb %}
    {% set n = printer["gcode_macro TOOL_POSITIONS"].tool_count|int %}
    {% if 'CLEAR' in params and params.CLEAR|int %}
        {% set ns = namespace(out="") %}
        {% for i in range(rgb|length) %}
            {% set ns.out = (ns.out ~ ", " if ns.out != "" else "") ~ "-1" %}
        {% endfor %}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_COLOR_VARS VARIABLE=rgb VALUE="[{ns.out}]"
        _INDX_APPLY_LED TOOL=-1
    {% elif 'TOOL' not in params or "COLOR=" not in rawparams %}
        {action_raise_error("SET_FILAMENT_COLOR TOOL=<n> COLOR=<hex> (or CLEAR=1)")}
    {% else %}
        {% set tool = params.TOOL|int %}
        {% if tool < 0 or tool >= n or tool >= (rgb|length) %}
            {action_raise_error("SET_FILAMENT_COLOR TOOL=%d out of range"|format(tool))}
        {% endif %}
        # NB: params.COLOR splits on A-F (traditional gcode parser). Hex is in rawparams.
        {% set hex = rawparams.split("COLOR=")[1].split()[0]|replace('"',"")|replace("'","")|trim|upper %}
        {% if hex[:2] == "0X" %}
            {% set hex = hex[2:] %}
        {% endif %}
        {% if hex|length == 7 %}
            {% set hex = hex[1:] %}
        {% endif %}
        {% if hex|length != 6 %}
            {action_raise_error("SET_FILAMENT_COLOR: bad COLOR len=%d"|format(hex|length))}
        {% endif %}
        {% set packed = hex[0:2]|int(base=16) * 65536 + hex[2:4]|int(base=16) * 256 + hex[4:6]|int(base=16) %}
        {% set ns = namespace(out="") %}
        {% for i in range(rgb|length) %}
            {% set v = packed if i == tool else rgb[i]|int %}
            {% set ns.out = (ns.out ~ ", " if ns.out != "" else "") ~ ("%d"|format(v)) %}
        {% endfor %}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_COLOR_VARS VARIABLE=rgb VALUE="[{ns.out}]"
        {% if printer.save_variables.variables.active_tool|default(-1)|int == tool %}
            _INDX_APPLY_LED TOOL={tool}
        {% endif %}
    {% endif %}

[gcode_macro _INDX_APPLY_LED]
description: Inner - FORCE_COLOR from stored slot, or CLEAR when TOOL=-1 / unset
gcode:
    {% if 'INDX_LED_FORCE_COLOR' in printer.gcode.commands %}
        {% set t = params.TOOL|int %}
        {% set rgb = printer["gcode_macro _FILAMENT_COLOR_VARS"].rgb %}
        {% set packed = rgb[t]|int if t >= 0 and t < (rgb|length) else -1 %}
        {% if packed < 0 %}
            INDX_LED_FORCE_COLOR CLEAR=1
        {% else %}
            INDX_LED_FORCE_COLOR RED={packed // 65536} GREEN={(packed // 256) % 256} BLUE={packed % 256}
        {% endif %}
    {% endif %}

[gcode_macro _INDX_LED_COLOR_CHECK]
description: Hex parse self-check
gcode:
    {% set h = "{0:c}"|format(35) %}
    {% set hex = (h ~ "00AE42") %}
    {% if hex|length == 7 %}
        {% set hex = hex[1:] %}
    {% endif %}
    {% set r = hex[0:2]|int(base=16) %}
    {% set g = hex[2:4]|int(base=16) %}
    {% set b = hex[4:6]|int(base=16) %}
    {% if hex|length != 6 or r != 0 or g != 174 or b != 66 %}
        {action_raise_error("_INDX_LED_COLOR_CHECK: got %s -> %d,%d,%d"|format(hex, r, g, b))}
    {% endif %}
    RESPOND MSG="_INDX_LED_COLOR_CHECK: pass"
