#####################################################################
#  INDX FILAMENT FORCE (filament_force klippy extra - experimental)
#####################################################################
#
#  Requires the tool_state repo extras installed into the klippy
#  checkout (./install.sh <klipper_dir> symlinks tool_monitor_core,
#  force_signal, tool_state, and filament_force).
#
#  Include after indx-tool-state.cfg:
#    [include indx/indx-tool-state.cfg]
#    [include indx/indx-filament-force.cfg]
#    [include indx/indx-helpers.cfg]
#
#  Continuous detection is OFF by default. Capture empty-vs-loaded
#  load-cell traces (see tool_state docs/runout_trace_capture.md), then
#  enable after SNR looks good on-bed.
#
#  Continuous runout = sustained forward-E force drop (drop_ratio +
#  runout_max_level_g over confirm_windows). Presence probe is on-demand
#  only: FILAMENT_FORCE_CHECK_SPIKE (e.g. before purge).
#
#  Per-tool: after a successful pickup, _RECORD_TOOLCHANGE calls
#  FILAMENT_FORCE_SET_TOOL so history is bound to that tool.
#
#  Latch E uses the extruder motor. Toolchange macros keep scoring
#  suppressed from CHANGE_TOOL / PARK_TOOL start through pickup lock;
#  PARK_TOOL clears suppress when done (standalone), CHANGE_TOOL
#  re-suppresses before _PICKUP_TOOL, and _RECORD_TOOLCHANGE clears on
#  success. Failed pickup clears suppress in fail_gcode /
#  _PICKUP_TOOL_FINISH. INDX_LOCK / INDX_UNLOCK also suppress around the
#  latch move.
#
#####################################################################

[filament_force]
sensor: load_cell_probe
extruder: extruder
# continuous_detection: True
#   Master enable at boot. PRINT_START calls FILAMENT_FORCE_RESET,
#   FILAMENT_FORCE_SET_TOOL, then FILAMENT_FORCE_SET ENABLE=1 so a
#   prior print's learned band does not carry over.
detection_length: 4
#   Forward E mm per print window (jam latency). Do not raise this to
#   fake melt time; use min_learn_s instead.
min_e_speed: 1
#   Skip gate only; not a score divisor.
#speed_bins: 1.0, 2.0, 4.0, 7.0
#   Interior edges. Bin i is [prev, edge) with 0 / +inf sentinels:
#   0: 0.50-1.0  1: 1.0-2.0  2: 2.0-4.0  3: 4.0-7.0  4: >= 7.0
#   Hard assignment from the window's mean e_speed (mm/s, not volumetric).
#   Score raw grams in that bin. Empty faster bins learn only (no HIGH);
#   oh_shit_force is the jam path until that bin has learned. Runout is
#   global, not per-bin.
#idle_reset_s: 0.3
#   Reset the E window after this much idle so travel does not stitch
#   infill beads into one 4 mm window.
#min_learn_s: 1.5
#   After idle_reset_s, a window shorter than this is not learned
#   (post-dwell short bead). Continuous cruise is learned even when
#   4 mm finishes in well under 1.5 s.
#rolling_window: 0.05
#baseline_time: 0.15
#drop_ratio: 0.35
#   Runout when raw grams <= drop_ratio * recent healthy mean AND ...
#runout_max_level_g: 80
#   ... raw grams <= this absolute floor (blocks relative-only false lows).
#confirm_windows: 3
#   Consecutive collapsed windows before RUNOUT trip (global). HIGH
#   confirm is consecutive in the same e-speed bin.
#recover_windows: 2
#min_delta_g: 15.0
#   Raw grams (no longer g/(mm/s)).
#high_sigma: 4.0
#   Jam band (high force) per bin.
#history_n: 16
#min_learn_windows: 5
#   Per e-speed bin on this experiment branch.
#probe_retract_mm: 3.0
#probe_extra_prime_mm: 0.2
#probe_spike_g: 50.0
#probe_feedrate: 30.0
#   Used only by FILAMENT_FORCE_CHECK_SPIKE (on-demand; not continuous).
oh_shit_force: 4000
#jam_dwell_s: 0.15
#   Absolute high-force safety (jam path).
#poll_interval_ms: 250
#runout_gcode:
#jam_gcode:
#recover_gcode:
#resume_gcode:
#debug_log: True
#   Parsable filament_force ev=window|skip|trip lines to klippy.log
#   (grep filament_force). FILAMENT_FORCE_TEST_RUNOUT RETRACT= TEMP=
#   [SPEED=] [RETRACT_SPEED=] empties then pushes forward E for runout.
