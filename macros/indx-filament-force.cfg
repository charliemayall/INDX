#####################################################################
#  INDX FILAMENT FORCE (filament_force klippy extra - experimental)
#####################################################################
#
#  Requires the tool_state repo extras installed into the klippy
#  checkout (./install.sh <klipper_dir> symlinks tool_monitor_core,
#  force_signal, tool_state, and filament_force).
#
#  Include after indx-tool-state.cfg:
#    [include indx/indx-tool-state.cfg]
#    [include indx/indx-filament-force.cfg]
#    [include indx/indx-helpers.cfg]
#
#  Continuous detection is OFF by default. Capture empty-vs-loaded
#  load-cell traces (see tool_state docs/runout_trace_capture.md), then
#  FILAMENT_FORCE_CALIBRATE MODE=EMPTY and MODE=LOADED per tool before
#  enabling.
#
#  Per-tool priors: after a successful pickup, _RECORD_TOOLCHANGE calls
#  FILAMENT_FORCE_SET_TOOL so runout LLR / presence probe use that tool's
#  empty and loaded priors.
#
#  Latch E uses the extruder motor. Toolchange macros keep scoring
#  suppressed from CHANGE_TOOL / PARK_TOOL start through pickup lock;
#  PARK_TOOL clears suppress when done (standalone), CHANGE_TOOL
#  re-suppresses before _PICKUP_TOOL, and _RECORD_TOOLCHANGE clears on
#  success. Failed pickup clears suppress in fail_gcode /
#  _PICKUP_TOOL_FINISH. INDX_LOCK / INDX_UNLOCK also suppress around the
#  latch move.
#
#####################################################################

[filament_force]
sensor: load_cell_probe
extruder: extruder
# continuous_detection: False
#   Master enable at boot. PRINT_START calls FILAMENT_FORCE_SET_TOOL
#   then FILAMENT_FORCE_SET ENABLE=1 after INDX_TC_POST (only when
#   QUERY shows ready=yes for the active tool).
detection_length: 4
#   Forward E mm per print suspect window.
#min_e_speed: 0.5
#rolling_window: 0.05
#baseline_time: 0.15
#min_delta_g: 15.0
#llr_margin: 2.0
#suspect_windows: 2
#   Consecutive empty-preferring print windows before presence probe.
#probe_retract_mm: 3.0
#probe_prime_mm: 3.0
#probe_feedrate: 30.0
#probe_cooldown_mm: 20.0
#   After a cleared probe, ignore new suspects for this much forward E.
#empty_mean_g: / empty_stdev_g:
#loaded_mean_g: / loaded_stdev_g:
#   Optional global fallbacks when a tool is not yet calibrated.
abort_force_g: 3000
#jam_dwell_s: 0.15
#   Absolute high-force safety (jam path; no residual CUSUM yet).
#poll_interval_ms: 250
#runout_gcode:
#jam_gcode:
#recover_gcode:
#resume_gcode:
#presence_probe_gcode:
#   Optional override; default is M83 retract then deretract at probe_*.
