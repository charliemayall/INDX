#####################################################################
#  INDX FILAMENT FORCE (filament_force klippy extra - experimental)
#####################################################################
#
#  Requires the tool_state repo extras installed into the klippy
#  checkout (./install.sh <klipper_dir> symlinks tool_monitor_core,
#  force_signal, tool_state, and filament_force).
#
#  Include after indx-tool-state.cfg:
#    [include indx/indx-tool-state.cfg]
#    [include indx/indx-filament-force.cfg]
#    [include indx/indx-helpers.cfg]
#
#  Continuous detection is OFF by default. Capture empty-vs-loaded
#  load-cell traces (see tool_state docs/runout_trace_capture.md) and
#  confirm on-bed SNR before enabling.
#
#  Per-tool history: after a successful pickup, _RECORD_TOOLCHANGE calls
#  FILAMENT_FORCE_SET_TOOL so anomalies are judged against that tool's
#  own prior windows.
#
#  Latch E uses the extruder motor. Toolchange macros keep scoring
#  suppressed from CHANGE_TOOL / PARK_TOOL start through pickup lock;
#  PARK_TOOL clears suppress when done (standalone), CHANGE_TOOL
#  re-suppresses before _PICKUP_TOOL, and _RECORD_TOOLCHANGE clears on
#  success. Failed pickup clears suppress in fail_gcode /
#  _PICKUP_TOOL_FINISH. INDX_LOCK / INDX_UNLOCK also suppress around the
#  latch move.
#
#####################################################################

[filament_force]
#sensor: load_cell_probe
#extruder: extruder
#continuous_detection: False
#   Master enable at boot. Prefer FILAMENT_FORCE_SET ENABLE=1 from
#   PRINT_START after traces prove SNR.
#detection_length: 7.0
#   Forward E mm per scored window (motion-sensor analogue).
#min_e_speed: 0.5
#   Below this mm/s, do not score (ooze / idle).
#rolling_window: 0.05
#baseline_time: 0.15
#   Pre-extrusion seconds used to lock force_ref after arm.
#ignore_unretract: True
#   Skip forward E that matches the preceding retract (prime/de-retract).
#min_delta_g: 15.0
#   Noise floor for band edges and near-zero stdev.
#low_sigma: 3.0
#high_sigma: 4.0
#low_mean_ratio: 0.4
#confirm_windows: 2
#   Consecutive anomalous scored windows before soft-pause.
#recover_windows: 2
#   Consecutive healthy scored windows that clear a suspect streak.
#history_n: 30
#min_learn_windows: 8
#   No trips until this many healthy windows exist for the active tool.
#abort_force_g: 1800
#jam_dwell_s: 0.15
#   Absolute high-force safety (independent of learning).
#poll_interval_ms: 250
#runout_gcode:
#   Optional template on runout trip. Context: TOOL, REASON, MSG, TARGET.
#jam_gcode:
#   Optional template on jam trip. Same context params.
#recover_gcode:
#   Optional template on FILAMENT_FORCE_RESUME after a soft pause.
#resume_gcode:
#   Optional; default _CLIENT_RESUME / RESUME_BASE.
