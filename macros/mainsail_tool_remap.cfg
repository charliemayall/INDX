#####################################################################
#  Mainsail tool remap - map table only
#####################################################################
#
#  Include from printer.cfg (after indx.cfg):
#    [include mainsail_tool_remap.cfg]
#
#  Do not include Mainsail's builtin Tn wrappers (rename_existing).
#  This branch already defines [gcode_macro T0]..T4; wrapping those
#  fails at connect with: Existing command 'T0' not found.
#
#  Mainsail Apply / start-print writes:
#    SET_GCODE_VARIABLE MACRO=_MAINSAIL_TOOL_MAP VARIABLE=enabled VALUE=True
#    SET_GCODE_VARIABLE MACRO=_MAINSAIL_TOOL_MAP VARIABLE=t0 VALUE=2
#
#  Slicer Tn and PRINT_START TOOL= go through _INDX_CHANGE_SLICER_TOOL
#  (indx.cfg). CHANGE_TOOL TOOL= stays the physical dock index
#  (homing, CAL_*, TC_CYCLE_ALL, console).
#
#  Declare variable_tN for every installed tool. Extra slots default
#  to identity; missing slots are skipped by Mainsail (silent no-op).
#  Map is RAM-only; Apply or start a print again after FIRMWARE_RESTART.
#
#####################################################################

[gcode_macro _MAINSAIL_TOOL_MAP]
description: Mainsail tool remap table. Updated via SET_GCODE_VARIABLE from the UI.
variable_enabled: True
variable_t0: 0
variable_t1: 1
variable_t2: 2
variable_t3: 3
variable_t4: 4
gcode:
    {% set m = printer["gcode_macro _MAINSAIL_TOOL_MAP"] %}
    {action_respond_info(
        "Mainsail tool map enabled=%s t0=%s t1=%s t2=%s t3=%s t4=%s"
        % (m.enabled, m.t0, m.t1, m.t2, m.t3, m.t4)
    )}
