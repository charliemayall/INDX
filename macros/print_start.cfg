#####################################################################
#  Example PRINT_START for INDX + OrcaSlicer
#
#  Include from printer.cfg:
#    [include print_start.cfg]
#
#  Orca start G-code (example):
#    PRINT_START BED_TEMP=[bed_temperature_initial_layer_single] \
#                EXTRUDER_TEMP={first_layer_temperature[initial_tool]} \
#                TOOL=[initial_tool] \
#                TYPE={filament_type[initial_tool]}
#
#  Requires KAMP Smart_Park.cfg. Height is set via _KAMP_Settings
#  (stock SMART_PARK has no Z= param).
#  Call INDX_TC_RESET inside PRINT_START so first-use station purge
#  (first_use_purge_mm) applies per print for each tool.
#
#  Sequence notes:
#  - Before the early CHANGE_TOOL TOOL={tool}: SET_KINEMATIC_POSITION Z
#    (if Z unhomed) so Z-hop is legal, and bracket with homing_busy so
#    CHANGE_TOOL does not emit a full G28 (would cold-probe Z). Real
#    soft G28 Z follows WAIT_TEMP, with the print's initial tool seated.
#  - Soft-heat (WAIT_TEMP, default 160) before first G28 Z / tilt.
#  - Skip SAFE_Z_TILT_ADJUST (+ post-tilt G28 Z) when
#    printer.z_tilt.applied is already true (cleared on motor off),
#    or when quick_start=1 (TOGGLE_QUICK_START).
#  - Start print temp after tilt so the ramp overlaps SMART_PARK.
#    Wait for bed + nozzle with TEMPERATURE_WAIT before INDX_TC_POST so
#    station E moves cannot hit min_extrude_temp.
#  - BED_MESH_CALIBRATE stays commented; enable if you need mesh.
#    quick_start=1 also skips bed mesh when enabled.
#####################################################################

[gcode_macro PRINT_START]
description: Home Y/X, pick initial tool for Z, tilt, park, bed wait, station purge
variable_quick_start: 0
gcode:
    {% set bed_temp = params.BED_TEMP|float %}
    {% set extruder_temp = params.EXTRUDER_TEMP|float %}
    {% set tool = params.TOOL|default(0)|int %}
    {% set wait_temp = params.WAIT_TEMP|default(160)|float %}
    {% set filament_type = params.TYPE|default("")|string %}
    {% set quick_start = printer["gcode_macro PRINT_START"].quick_start|int %}

    INDX_TC_RESET

    M140 S{bed_temp}

    G28 Y
    G28 X

    # Fake-home Z so CHANGE_TOOL can Z-hop; real soft G28 Z comes after heat.
    # homing_busy also blocks CHANGE_TOOL's auto full-G28 while Z is unprobed.
    {% if "z" not in printer.toolhead.homed_axes %}
        SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=homing_busy VALUE=1
    CHANGE_TOOL TOOL={tool}
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=homing_busy VALUE=0

    M104 S{wait_temp} # after first tool pick or error if no tool loaded.
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={wait_temp - 3}
    G28 Z
    SYNC_MOTORS
    {% if quick_start %}
        {action_respond_info("PRINT_START: quick_start=1 - skipping SAFE_Z_TILT_ADJUST and bed mesh")}
    {% else %}
        {% if 'z_tilt' in printer and printer.z_tilt.applied %}
            {action_respond_info("PRINT_START: z_tilt already applied - skipping SAFE_Z_TILT_ADJUST")}
        {% else %}
            SAFE_Z_TILT_ADJUST
            G28 Z
        {% endif %}
        # BED_MESH_CALIBRATE ADAPTIVE=1
    {% endif %}


    # KAMP SMART_PARK reads smart_park_height; Z= is ignored
    SET_GCODE_VARIABLE MACRO=_KAMP_Settings VARIABLE=smart_park_height VALUE=0.4
    # SMART_PARK

    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp-3}
    M104 S{extruder_temp}
    # TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder_temp - 3}
    # First-use station purge; INDX_TC_POST still stages eject + near-full.
    # TYPE= selects material purge speed (e.g. TPU slower purge).
    {% if filament_type %}
        INDX_TC_POST TEMP={extruder_temp} TYPE={filament_type}
    {% else %}
        INDX_TC_POST TEMP={extruder_temp}
    {% endif %}

[gcode_macro TOGGLE_QUICK_START]
description: Toggle PRINT_START quick_start (skip tilt + bed mesh when on)
gcode:
    {% set cur = printer["gcode_macro PRINT_START"].quick_start|int %}
    {% set new = 0 if cur else 1 %}
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=quick_start VALUE={new}
    {action_respond_info("QUICK_START: %s (quick_start=%d)" % ("on" if new else "off", new))}
