#####################################################################
#  Example PRINT_START for INDX + OrcaSlicer
#
#  Include from printer.cfg:
#    [include print_start.cfg]
#
#  Orca start G-code (example):
#    PRINT_START BED_TEMP=[bed_temperature_initial_layer_single] \
#                EXTRUDER_TEMP={first_layer_temperature[initial_tool]} \
#                TOOL=[initial_tool]
#
#  Do NOT call INDX_TC_POST here. Orca change_filament_gcode already runs
#  T{initial} + INDX_TC_POST after start; a second post here double-purges.
#  Keep station purge only in change_filament:
#    T{next_extruder} TEMP={temperature[next_extruder]}
#    M400
#    INDX_TC_POST TEMP={temperature[next_extruder]} \
#        TYPE={filament_type[next_extruder]} \
#        RETRACT={new_retract_length}
#
#  Requires KAMP Smart_Park.cfg. Height is set via _KAMP_Settings
#  (stock SMART_PARK has no Z= param).
#  Call INDX_TC_RESET inside PRINT_START so first-use station purge
#  (first_use_purge_mm) applies per print for each tool, and so any
#  TEMP_OVERRIDE from a prior print is cleared.
#
#  Sequence notes:
#  - Before the early CHANGE_TOOL TOOL={tool}: SET_KINEMATIC_POSITION Z
#    (if Z unhomed) so Z-hop is legal, and bracket with homing_busy so
#    CHANGE_TOOL does not emit a full G28 (would cold-probe Z). Real
#    soft G28 Z follows WAIT_TEMP, with the print's initial tool seated.
#  - Soft-heat (WAIT_TEMP, default 160) before first G28 Z / brush / tilt.
#  - After SYNC_MOTORS, dwell before SAFE_Z_TILT_ADJUST. LIS2DW bulk
#    sampling shares indxmcu with the load cell; without a settle,
#    probe tare can see ADS131 overflows at sample_rate 500.
#  - Skip SAFE_Z_TILT_ADJUST (+ post-tilt G28 Z) when
#    printer.z_tilt.applied is already true (cleared on motor off),
#    or when quick_start=1 (TOGGLE_QUICK_START).
#  - SAFE_Z_TILT_ADJUST is two-phase: coarse HORIZONTAL_MOVE_Z=8 until
#    range <=1mm, then fine HORIZONTAL_MOVE_Z=2 until <=0.05mm.
#  - Start print temp after tilt so the ramp overlaps SMART_PARK.
#    Full nozzle wait lives in the slicer's INDX_TC_POST (near_full).
#  - BED_MESH_CALIBRATE stays commented; enable if you need mesh.
#    quick_start=1 also skips bed mesh when enabled.
#  - Reset filament_force history, bind TOOL=, ENABLE=1 before returning.
#    A prior print's slow-learn band must not carry over. The following
#    INDX_TC_POST suppresses during station E. CHANGE_TOOL may skip
#    SET_TOOL when the tool is already active.
#  - TOOL= is the slicer index. Remap via _MAINSAIL_TOOL_MAP (same as
#    Tn) before CHANGE_TOOL / FILAMENT_FORCE_SET_TOOL. Direct
#    CHANGE_TOOL TOOL=n stays physical.
#####################################################################

# Two-phase Z tilt: coarse at high lift (safe when bed is far out), then
# fine at low lift. Overrides any SAFE_Z_TILT_ADJUST in utilities.cfg when
# this file is included after it.
[gcode_macro SAFE_Z_TILT_ADJUST]
description: Coarse Z_TILT at Z=8 to <=1mm, then fine at Z=2 to <=0.05mm
gcode:
    SAVE_GCODE_STATE NAME=STATE_Z_TILT
    BED_MESH_CLEAR
    RESPOND MSG="Bed Mesh cleared by SAFE_Z_TILT_ADJUST"
    
    # Phase 1: high travel - get roughly level before flying low
    RESPOND MSG="SAFE_Z_TILT: coarse pass HORIZONTAL_MOVE_Z=8 RETRY_TOLERANCE=1"
    Z_TILT_ADJUST HORIZONTAL_MOVE_Z=8 RETRY_TOLERANCE=1 RETRIES=5
    # Phase 2: low travel - both commands are emitted up front (Jinja
    # evaluates once); the fine pass runs after the coarse pass finishes.
    RESPOND MSG="SAFE_Z_TILT: fine pass HORIZONTAL_MOVE_Z=2 RETRY_TOLERANCE=0.05"
    Z_TILT_ADJUST HORIZONTAL_MOVE_Z=2 RETRY_TOLERANCE=0.05 RETRIES=5
    
    
    
    RESTORE_GCODE_STATE NAME=STATE_Z_TILT

[gcode_macro PRINT_START]
description: Home Y/X, pick initial tool for Z, tilt, bed wait - slicer owns INDX_TC_POST
variable_quick_start: 0
gcode:
    {% set bed_temp = params.BED_TEMP|float %}
    {% set extruder_temp = params.EXTRUDER_TEMP|float %}
    {% set ns = namespace(slicer=params.TOOL|default(0)|int, tool=params.TOOL|default(0)|int, done=False) %}
    {% if "gcode_macro _MAINSAIL_TOOL_MAP" in printer %}
        {% set map = printer["gcode_macro _MAINSAIL_TOOL_MAP"] %}
        {% if map.enabled %}
            {% for i in range(8) %}
                {% if not ns.done and ns.tool == i %}
                    {% set k = "t" ~ i %}
                    {% if k in map %}
                        {% set ns.tool = map[k]|int %}
                    {% endif %}
                    {% set ns.done = True %}
                {% endif %}
            {% endfor %}
        {% endif %}
    {% endif %}
    {% set tool = ns.tool %}
    {% if tool != ns.slicer %}
        {action_respond_info("tool remap: T%d -> T%d"|format(ns.slicer, tool))}
    {% endif %}
    {% set wait_temp = params.WAIT_TEMP|default(180)|float %}
    {% set quick_start = printer["gcode_macro PRINT_START"].quick_start|int %}

    INDX_TC_RESET

    M140 S{bed_temp}

    G28 Y
    G28 X

    # Fake-home Z so CHANGE_TOOL can Z-hop; real soft G28 Z comes after heat.
    # homing_busy also blocks CHANGE_TOOL's auto full-G28 while Z is unprobed.
    {% if "z" not in printer.toolhead.homed_axes %}
        SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=homing_busy VALUE=1
    CHANGE_TOOL TOOL={tool}
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=homing_busy VALUE=0

    M104 S{wait_temp} # after first tool pick or error if no tool loaded.
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={wait_temp - 3}
    G28 Z
    # Wipe nozzle on the purge brush (INDX_TC_VARS), then re-home Z.
    _INDX_TC_GOTO_STATION
    _INDX_TC_BRUSH
    _INDX_TC_EXIT_STATION
    G28 Z
    SYNC_MOTORS
    # LIS2DW (motor sync) and ADS131 share indxmcu. Wait for bulk
    # sampling / USB backlog to drain before load-cell probe tare.
    M400
    G4 P2000
    {% if quick_start %}
        {action_respond_info("PRINT_START: quick_start=1 - skipping SAFE_Z_TILT_ADJUST and bed mesh")}
    {% else %}
        {% if 'z_tilt' in printer and printer.z_tilt.applied %}
            {action_respond_info("PRINT_START: z_tilt already applied - skipping SAFE_Z_TILT_ADJUST")}
        {% else %}
            SAFE_Z_TILT_ADJUST
            G28 Z
        {% endif %}

    {% endif %}
    BED_MESH_PROFILE LOAD=basic
    {action_respond_info("PRINT_START: loaded bed mesh")}
        # BED_MESH_CALIBRATE ADAPTIVE=1


    # KAMP SMART_PARK reads smart_park_height; Z= is ignored
    SET_GCODE_VARIABLE MACRO=_KAMP_Settings VARIABLE=smart_park_height VALUE=0.4
    # SMART_PARK

    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp-3}
    M104 S{extruder_temp}
    # Nozzle near-full wait + station purge: slicer change_filament_gcode
    # (T + INDX_TC_POST). Do not call INDX_TC_POST here.

    # Arm filament health before slicer POST (POST suppresses during E).
    # RESET drops last-print windows; SET_TOOL covers CHANGE_TOOL no-op
    # (tool already active).
    {% if 'filament_force' in printer %}
        FILAMENT_FORCE_RESET TOOL={tool}
        FILAMENT_FORCE_SET_TOOL TOOL={tool}
        FILAMENT_FORCE_SET ENABLE=1
    {% endif %}

[gcode_macro TOGGLE_QUICK_START]
description: Toggle PRINT_START quick_start (skip tilt + bed mesh when on)
gcode:
    {% set cur = printer["gcode_macro PRINT_START"].quick_start|int %}
    {% set new = 0 if cur else 1 %}
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=quick_start VALUE={new}
    {action_respond_info("QUICK_START: %s (quick_start=%d)" % ("on" if new else "off", new))}
