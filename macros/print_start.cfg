#####################################################################
#  Example PRINT_START for INDX + OrcaSlicer
#
#  Include from printer.cfg:
#    [include print_start.cfg]
#
#  Orca start G-code (example):
#    PRINT_START BED_TEMP=[bed_temperature_initial_layer_single] \
#                EXTRUDER_TEMP={first_layer_temperature[initial_tool]} \
#                TOOL=[initial_tool]
#
#  Requires KAMP Smart_Park.cfg. Height is set via _KAMP_Settings
#  (stock SMART_PARK has no Z= param).
#  Call INDX_TC_RESET inside PRINT_START so first-use station purge
#  (first_use_purge_mm) applies per print for each tool.
#####################################################################

[gcode_macro PRINT_START]
description: Home Y/X, pick T0 for Z, load initial tool, SMART_PARK, mesh, heat, station purge
gcode:
    {% set bed_temp = params.BED_TEMP|float %}
    {% set extruder_temp = params.EXTRUDER_TEMP|float %}
    {% set tool = params.TOOL|default(0)|int %}
    {% set wait_temp = params.WAIT_TEMP|default(180)|float %}

    INDX_TC_RESET

    M140 S{bed_temp}

    G28 Y
    G28 X

    CHANGE_TOOL TOOL=0

    M104 S{wait_temp} # after T0 or error if no tool loaded.
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={wait_temp - 3}
    G28 Z
    SAFE_Z_TILT_ADJUST
    G28 Z
    BED_MESH_CALIBRATE ADAPTIVE=1
    M104 S{wait_temp}
    {% if tool != 0 %}
        CHANGE_TOOL TOOL={tool}
    {% endif %}

    # KAMP SMART_PARK reads smart_park_height; Z= is ignored
    SET_GCODE_VARIABLE MACRO=_KAMP_Settings VARIABLE=smart_park_height VALUE=0.4
    SMART_PARK

    M190 S{bed_temp}
    M104 S{extruder_temp}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder_temp - 3}
    # First-use station purge for the initial tool (25 mm filament by default)
    INDX_TC_POST TEMP={extruder_temp}
